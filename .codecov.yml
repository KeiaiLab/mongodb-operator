# standards/testing.md §5: 변경된 코드 커버 여부 우선, 라인 70%+ 권장.
# threshold 1% → 70% 상향 (testing.md 위반 해소). ADR-XXXX 참조.
coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 1%
        informational: false
        base: auto
    patch:
      default:
        target: 70%
        threshold: 1%
        informational: false
        base: auto

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  - "**/*_test.go"
  - "**/zz_*.go"
  - "**/*.pb.go"
  - "third_party/**"
  - "vendor/**"
