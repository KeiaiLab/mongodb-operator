name: ArtifactHub verify

on:
  workflow_run:
    workflows: ["Helm chart publish"]
    types: [completed]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "이미 publish된 tag (예: v0.4.0). gh-pages 인덱싱/서명 검증 대상."
        required: false
  pull_request:
    paths:
      - 'charts/**'
      - 'hack/artifacthub_*.sh'
      - '.github/workflows/artifacthub-verify.yml'

permissions:
  contents: read

concurrency:
  group: artifacthub-verify-${{ github.repository }}
  cancel-in-progress: false

jobs:
  lint:
    name: ah lint (메타데이터)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install ah CLI
        run: |
          set -euo pipefail
          AH_VERSION="1.22.0"   # 최신 stable — https://github.com/artifacthub/hub/releases/latest
          curl -fsSL -o /tmp/ah.tar.gz \
            "https://github.com/artifacthub/hub/releases/download/v${AH_VERSION}/ah_${AH_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/ah.tar.gz -C /tmp ah
          sudo install /tmp/ah /usr/local/bin/ah
          ah version
      - name: ah lint
        run: ah lint --kind helm --path charts
      # artifacthub.io/images 는 정적 텍스트라 릴리스 bump 에서 조용히 뒤처진다 —
      # 1.16.5~1.16.7 세 릴리스가 내부 전용 harbor.keiailab.dev:v1.16.4 핀을 그대로 실어
      # ArtifactHub 스캐너가 매 스캔 DNS 실패했다. 외부 스캐너/사용자가 도달 가능한
      # 공개 레지스트리 + appVersion 정합을 PR 게이트로 강제한다.
      - name: images annotation ↔ appVersion 정합 (공개 레지스트리 강제)
        run: |
          set -euo pipefail
          CHART=charts/mongodb-operator/Chart.yaml
          APP_VERSION=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' "$CHART")
          test -n "$APP_VERSION"
          grep -q "image: ghcr.io/keiailab/mongodb-operator:v${APP_VERSION}\$" "$CHART" || {
            echo "::error file=$CHART::artifacthub.io/images 의 operator 이미지가 ghcr.io/keiailab/mongodb-operator:v${APP_VERSION} 와 불일치"
            exit 1
          }
          if grep -rEn '(image|repository): *[^ ]*keiailab\.dev' charts/; then
            echo "::error::charts/ 에 내부 전용 레지스트리(*.keiailab.dev) 이미지 참조 — 외부에서 pull/스캔 불가"
            exit 1
          fi

  smoke:
    name: ArtifactHub 인덱싱/서명 smoke
    runs-on: ubuntu-latest
    # PR 시점엔 chart가 아직 publish 전이라 false-negative. publish workflow 완료 후 또는 tag/dispatch에서 실행.
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: latest
      - name: Ensure Artifact Hub repository registration
        env:
          ARTIFACTHUB_API_KEY_ID: ${{ secrets.AH_API_KEY_ID }}
          ARTIFACTHUB_API_KEY_SECRET: ${{ secrets.AH_API_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACTHUB_API_KEY_ID:-}" ] || [ -z "${ARTIFACTHUB_API_KEY_SECRET:-}" ]; then
            echo "::warning::Artifact Hub API credentials are not configured; smoke will report registration state."
            exit 0
          fi
          if ! bash hack/artifacthub_register.sh; then
            echo "::notice::Artifact Hub registration request did not create a new repository; smoke will verify current state."
          fi
      - name: Run artifacthub smoke
        env:
          AH_API_KEY_ID: ${{ secrets.AH_API_KEY_ID }}
          AH_API_KEY_SECRET: ${{ secrets.AH_API_KEY_SECRET }}
          EXPECTED_ARTIFACTHUB_REPOSITORY_URL: https://keiailab.github.io/charts
          EXPECTED_CHART_VERSION: ${{ github.event.inputs.tag }}
          ARTIFACTHUB_SMOKE_ATTEMPTS: "90"
          ARTIFACTHUB_SMOKE_SLEEP_SECONDS: "30"
        run: bash hack/artifacthub_smoke.sh
