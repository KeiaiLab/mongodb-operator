name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=10m
          # Historical lint debt (legacy code, cache-clean count ~53): mostly
          # goconst (repeated string literals) + a few staticcheck QF style fixes.
          # All cosmetic — no correctness/security impact. (Correction: an earlier
          # comment claimed "0 violations"; that was a stale golangci-lint cache —
          # a cache-clean `golangci-lint run ./...` reports ~53.) only-new-issues
          # gates PRs on *new* findings only, so contributor PRs don't break on
          # pre-existing cosmetic debt; full cleanup is a low-priority follow-up.
          only-new-issues: true

  test:
    name: unit + envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: make test
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./cover.out
          fail_ci_if_error: false

  build:
    name: build manager binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
