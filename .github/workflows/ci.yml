name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=10m
          # 2026-06-03: historical lint debt cleared — `golangci-lint run ./...`
          # reports 0 violations (last `goconst` resolved via severity constants).
          # only-new-issues kept as deliberate policy: with version=latest, a linter
          # upgrade could flag pre-existing code; gating only on *new* issues keeps
          # contributor PRs from breaking on unrelated legacy findings.
          only-new-issues: true

  test:
    name: unit + envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: make test
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: ./cover.out
          fail_ci_if_error: false

  build:
    name: build manager binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
