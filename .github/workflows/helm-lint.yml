name: Helm chart lint

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: latest
      - uses: helm/chart-testing-action@v2.6.1
      - name: Run ct lint
        run: ct lint --target-branch=main --charts charts/mongodb-operator
      - name: Helm template smoke
        run: helm template test charts/mongodb-operator --debug > /tmp/render.yaml
      - name: kubeconform validate
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: -strict -ignore-missing-schemas -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' /tmp/render.yaml
