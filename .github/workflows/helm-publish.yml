name: Helm chart publish

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write   # push to gh-pages + create per-chart Release
  pages: read

concurrency:
  group: helm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Chart.yaml ↔ tag parity check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CHART_VER=$(grep '^version:' charts/mongodb-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
          if [ "$CHART_VER" != "$VERSION" ]; then
            echo "::error::Chart.yaml version ($CHART_VER) does not match tag ($VERSION)"; exit 1
          fi
          echo "✓ chart version aligned with tag ($VERSION)"

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure git for chart-releaser
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          # chart-releaser publishes to ./_releases by default; gh-pages branch
          # is updated via pages_branch input default.
          pages_branch: gh-pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
