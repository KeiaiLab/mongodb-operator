name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v1.4.21)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/keiailab/mongodb-operator

jobs:
  preflight:
    name: Chart.yaml ↔ tag parity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      app_version: ${{ steps.derive.outputs.app_version }}
      tag: ${{ steps.derive.outputs.tag }}
      image_release: ${{ steps.derive.outputs.image_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: derive
        env:
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${DISPATCH_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"
          CHART_VER=$(grep '^version:' charts/mongodb-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
          APP_VER=$(grep '^appVersion:' charts/mongodb-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
          if [ "$CHART_VER" != "$VERSION" ]; then
            echo "::error::Chart.yaml version=$CHART_VER does not match tag=$VERSION"; exit 1
          fi
          if [ "$APP_VER" = "$VERSION" ]; then
            IMAGE_RELEASE=true
            echo "✓ image release: tag=$TAG / version=$VERSION / appVersion=$APP_VER all aligned"
          else
            IMAGE_RELEASE=false
            echo "✓ chart-only release: tag=$TAG / chart=$VERSION / appVersion=$APP_VER"
            echo "  image/GitHub Release jobs will be skipped; Helm chart publish handles the chart artifact."
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "app_version=$APP_VER"
            echo "image_release=$IMAGE_RELEASE"
          } >> "$GITHUB_OUTPUT"
      - name: OLM bundle ↔ appVersion parity (ADR-0038)
        # bundle CSV spec.version 이 Chart.yaml appVersion 과 어긋나면(=Path 1 stale) 릴리스 차단.
        # CRD 개수(bundle == config/crd/bases)도 함께 검증. 단일 진실 소스 = Makefile verify-bundle-parity.
        run: make verify-bundle-parity

  chart-only-summary:
    name: Chart-only release summary
    needs: preflight
    if: needs.preflight.outputs.image_release == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "### Chart-only release"
            echo ""
            echo "- tag: ${{ needs.preflight.outputs.tag }}"
            echo "- chart version: ${{ needs.preflight.outputs.version }}"
            echo "- appVersion/image: ${{ needs.preflight.outputs.app_version }}"
            echo "- result: image, SBOM, and GitHub Release jobs intentionally skipped"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build & push linux/amd64 image
    needs: preflight
    if: needs.preflight.outputs.image_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # ghcr.io push
      id-token: write       # cosign keyless (future)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=raw,value=${{ needs.preflight.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom:
    name: SBOM (syft)
    needs: [preflight, image]
    if: needs.preflight.outputs.image_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read        # pull image from ghcr.io
    steps:
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}:${{ needs.preflight.outputs.version }}
          format: spdx-json
          output-file: mongodb-operator-${{ needs.preflight.outputs.tag }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: mongodb-operator-${{ needs.preflight.outputs.tag }}.spdx.json

  notes:
    name: Release notes (git-cliff)
    needs: preflight
    if: needs.preflight.outputs.image_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --strip all --tag ${{ needs.preflight.outputs.tag }} --unreleased
        env:
          OUTPUT: CHANGES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: CHANGES.md

  chart-tgz:
    name: Package helm chart
    needs: preflight
    if: needs.preflight.outputs.image_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with: { version: latest }
      - run: |
          mkdir -p out
          helm package charts/mongodb-operator -d out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chart-tgz
          path: out/mongodb-operator-*.tgz

  github-release:
    name: Create GitHub Release
    needs: [preflight, image, sbom, notes, chart-tgz]
    if: needs.preflight.outputs.image_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # gh release create
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: sbom,           path: assets }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: release-notes,  path: assets }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: chart-tgz,      path: assets }
      - name: Determine prerelease flag
        id: pre
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          case "$TAG" in
            *beta*|*rc*|*alpha*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)                   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ${{ needs.preflight.outputs.tag }}
          body_path: assets/CHANGES.md
          prerelease: ${{ steps.pre.outputs.prerelease == 'true' }}
          files: |
            assets/mongodb-operator-${{ needs.preflight.outputs.version }}.tgz
            assets/mongodb-operator-${{ needs.preflight.outputs.tag }}.spdx.json

  # ADR-0027 community-operators sync automation 폐기 (ADR-0028 Phase D, 2026-05-17).
  # OperatorHub.io 의 community-operators 채널을 통한 외부 사용자 distribution 영구 중단.
  # KeiaiLab 외부 사용자는 helm chart (charts/mongodb-operator/) 또는 OLM v1
  # (deploy/olm-v1/) 직접 사용. bundle/ + bundle.Dockerfile + catalog 파이프라인
  # 자체는 OLM v1 ClusterCatalog 의 backing input 으로 유지 (Makefile bundle/
  # bundle-build/bundle-push/catalog-build/catalog-push target).
