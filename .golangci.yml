version: "2"
run:
  allow-parallel-runners: true
linters:
  # 점진 강화 baseline (2026-05-07) — postgres 의 18 linter 수준에 가까이 정합.
  # 잔여 (dupl / lll / depguard / modernize / logcheck) 은 별 트랙.
  default: none
  enable:
    - copyloopvar
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    gocyclo:
      # kubebuilder Reconcile 패턴은 32 ~ 35 수준이 표준. postgres 와 정합.
      min-complexity: 35
  exclusions:
    generated: lax
    rules:
      # test code 패턴 — fixture 의 const 반복 / 미사용 helper param 은 정상.
      - linters:
          - goconst
          - unparam
        path: _test\.go
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
