# Pre-commit hooks configuration for MongoDB Operator
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_language_version:
  go: "1.25"

fail_fast: false

minimum_pre_commit_version: "3.0.0"

# Configuration for pre-commit hooks
ci:
  autofix_prs: true
  autofix_commit_msg: "style: auto-fix pre-commit issues"
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false

repos:
  # Pre-commit hooks for basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Removes trailing whitespace from modified files
        args: [--markdown-linebreak-ext=md]

      - id: end-of-file-fixer
        name: Fix end of files
        description: Ensures that a file is either empty or ends with one newline

      - id: check-yaml
        name: Check YAML files
        description: Checks YAML files for syntax errors
        args: [--unsafe]

      - id: check-added-large-files
        name: Check for large files
        description: Prevents large files from being committed
        args: ['--maxkb=1000']

      - id: check-case-conflict
        name: Check for case conflicts
        description: Checks for files that would conflict in case-insensitive filesystems

      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Checks for files that contain merge conflict strings

      - id: check-toml
        name: Check TOML files
        description: Checks TOML files for syntax errors

  # Golang hooks for Go code quality
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.62.2
    hooks:
      - id: golangci-lint
        name: golangci-lint
        description: Run golangci-lint with sensible defaults
        entry: golangci-lint run --fix
        types: [go]
        language: golang
        require_serial: true
        pass_filenames: false

  # Go-specific hooks from pre-commit
  # Stage 분리: pre-commit에는 빠른 fmt/vet만, pre-push에 무거운 test/scanner 배치
  - repo: local
    hooks:
      # ── pre-commit (commit 시점, 빠른 피드백) ───────────────────────
      - id: go-fmt
        name: go fmt
        description: Auto-formats Go code to gofmt standards
        entry: gofmt -w
        language: system
        types: [go]
        stages: [pre-commit]

      - id: go-vet
        name: go vet
        description: Runs go vet to find potential issues
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      # ── pre-push (push 시점, 무거운 검증) ──────────────────────────
      - id: go-test-unit
        name: go test (unit, race)
        description: Unit tests with race detector. envtest는 make test로 분리.
        entry: go test -race -count=1 -short ./internal/resources/... ./internal/mongodb/...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: govulncheck
        name: govulncheck (Go module CVE — call graph 기반)
        description: 코드가 실제 호출하는 취약 함수만 차단. 설치- go install golang.org/x/vuln/cmd/govulncheck@latest
        entry: govulncheck ./...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: trivy-fs
        name: trivy fs (lockfile + Dockerfile CVE — 버전 비교 기반)
        description: stdlib/transitive CVE 차단 (이번 사이클의 stdlib CVE 7건 패턴). 설치- brew install trivy
        entry: trivy fs --exit-code 1 --severity HIGH,CRITICAL --quiet --skip-dirs vendor .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gitleaks
        name: gitleaks (시크릿 누출 차단)
        description: staged 변경에서 시크릿 누출 검사
        entry: gitleaks protect --staged --no-banner --redact
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Commit message hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim commit message whitespace
        description: Removes trailing whitespace from commit messages
        stages: [commit-msg]
        types: [text]

  - repo: local
    hooks:
      - id: dco-signoff
        name: DCO Signed-off-by check (A-P0-5)
        description: Warns if Signed-off-by trailer missing. DCO_STRICT=1 to enforce.
        language: system
        entry: bash -c 'msg_file="$1"; if ! grep -qE "^Signed-off-by: .+ <.+@.+>" "$msg_file"; then if [ "${DCO_STRICT:-0}" = "1" ]; then echo "❌ DCO Signed-off-by trailer missing — use git commit -s"; exit 1; else echo "[warn] DCO Signed-off-by trailer missing (set DCO_STRICT=1 to enforce)"; fi; fi' --
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
