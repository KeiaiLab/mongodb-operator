{{- /* MongoDB CR (replicaset architecture) */}}
{{- if eq .Values.architecture "replicaset" }}
apiVersion: mongodb.keiailab.com/v1alpha1
kind: MongoDB
metadata:
  name: {{ include "mongodb-cluster.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb-cluster.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  members: {{ .Values.replicaset.members }}
  version:
    version: {{ .Values.version | quote }}
  storage:
    size: {{ .Values.storage.size }}
    {{- if .Values.storage.storageClassName }}
    storageClassName: {{ .Values.storage.storageClassName | quote }}
    {{- end }}
  auth:
    mechanism: {{ .Values.auth.mechanism | quote }}
    {{- if .Values.auth.adminCredentialsSecretRef.name }}
    adminCredentialsSecretRef:
      name: {{ .Values.auth.adminCredentialsSecretRef.name | quote }}
    {{- end }}
  {{- if .Values.tls.enabled }}
  tls:
    enabled: true
    {{- if .Values.tls.certManager.issuerRef.name }}
    certManager:
      issuerRef:
        name: {{ .Values.tls.certManager.issuerRef.name | quote }}
        kind: {{ .Values.tls.certManager.issuerRef.kind | quote }}
    {{- end }}
    {{- if .Values.tls.customCert.secretName }}
    customCert:
      secretName: {{ .Values.tls.customCert.secretName | quote }}
    {{- end }}
  {{- end }}
  {{- if .Values.monitoring.enabled }}
  monitoring:
    enabled: true
    serviceMonitor:
      enabled: {{ .Values.monitoring.serviceMonitor.enabled }}
      interval: {{ .Values.monitoring.serviceMonitor.interval | quote }}
  {{- end }}
  {{- if .Values.backup.enabled }}
  backup:
    enabled: true
    schedule: {{ .Values.backup.schedule | quote }}
    retention:
      days: {{ .Values.backup.retention.days }}
    storage:
      {{- toYaml .Values.backup.storage | nindent 6 }}
    pitrEnabled: {{ .Values.backup.pitrEnabled }}
    oplogRetentionHours: {{ .Values.backup.oplogRetentionHours }}
  {{- end }}
  {{- if .Values.network.policy.enabled }}
  networkPolicy:
    enabled: true
    allowExternal: {{ .Values.network.policy.allowExternal }}
  {{- end }}
  {{- if .Values.pdb.enabled }}
  podDisruptionBudget:
    enabled: true
    minAvailable: {{ .Values.pdb.minAvailable }}
  {{- end }}
  {{- if .Values.autoScaling.enabled }}
  autoScaling:
    enabled: true
    minReplicas: {{ .Values.autoScaling.minReplicas }}
    maxReplicas: {{ .Values.autoScaling.maxReplicas }}
  {{- end }}
  {{- if .Values.pod.diagnosticMode.enabled }}
  pod:
    diagnosticMode:
      enabled: true
  {{- end }}
{{- end }}
