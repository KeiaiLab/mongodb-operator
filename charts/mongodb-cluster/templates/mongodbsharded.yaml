{{- /* MongoDBSharded CR (sharded architecture) */}}
{{- if eq .Values.architecture "sharded" }}
apiVersion: mongodb.keiailab.com/v1alpha1
kind: MongoDBSharded
metadata:
  name: {{ include "mongodb-cluster.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb-cluster.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  version:
    version: {{ .Values.version | quote }}
  configServer:
    members: {{ .Values.sharded.configServer.members }}
    storage:
      size: {{ .Values.sharded.configServer.storage.size }}
      {{- if .Values.sharded.configServer.storage.storageClassName }}
      storageClassName: {{ .Values.sharded.configServer.storage.storageClassName | quote }}
      {{- end }}
    {{- if .Values.pod.diagnosticMode.enabled }}
    pod:
      diagnosticMode:
        enabled: true
    {{- end }}
  shards:
    count: {{ .Values.sharded.shards.count }}
    membersPerShard: {{ .Values.sharded.shards.membersPerShard }}
    storage:
      size: {{ .Values.sharded.shards.storage.size }}
      {{- if .Values.sharded.shards.storage.storageClassName }}
      storageClassName: {{ .Values.sharded.shards.storage.storageClassName | quote }}
      {{- end }}
    {{- if .Values.pod.diagnosticMode.enabled }}
    pod:
      diagnosticMode:
        enabled: true
    {{- end }}
  mongos:
    replicas: {{ .Values.sharded.mongos.replicas }}
    service:
      type: {{ .Values.sharded.mongos.service.type | quote }}
    {{- if .Values.pod.diagnosticMode.enabled }}
    pod:
      diagnosticMode:
        enabled: true
    {{- end }}
  auth:
    mechanism: {{ .Values.auth.mechanism | quote }}
    {{- if .Values.auth.adminCredentialsSecretRef.name }}
    adminCredentialsSecretRef:
      name: {{ .Values.auth.adminCredentialsSecretRef.name | quote }}
    {{- end }}
  {{- if .Values.tls.enabled }}
  tls:
    enabled: true
    {{- if .Values.tls.certManager.issuerRef.name }}
    certManager:
      issuerRef:
        name: {{ .Values.tls.certManager.issuerRef.name | quote }}
        kind: {{ .Values.tls.certManager.issuerRef.kind | quote }}
    {{- end }}
  {{- end }}
  {{- if .Values.monitoring.enabled }}
  monitoring:
    enabled: true
    serviceMonitor:
      enabled: {{ .Values.monitoring.serviceMonitor.enabled }}
      interval: {{ .Values.monitoring.serviceMonitor.interval | quote }}
  {{- end }}
  {{- if .Values.backup.enabled }}
  backup:
    enabled: true
    schedule: {{ .Values.backup.schedule | quote }}
    storage:
      {{- toYaml .Values.backup.storage | nindent 6 }}
    pitrEnabled: {{ .Values.backup.pitrEnabled }}
    oplogRetentionHours: {{ .Values.backup.oplogRetentionHours }}
  {{- end }}
  {{- if .Values.network.policy.enabled }}
  networkPolicy:
    enabled: true
    allowExternal: {{ .Values.network.policy.allowExternal }}
  {{- end }}
  {{- if .Values.pdb.enabled }}
  podDisruptionBudget:
    enabled: true
    minAvailable: {{ .Values.pdb.minAvailable }}
  {{- end }}
{{- end }}
