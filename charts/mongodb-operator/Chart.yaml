apiVersion: v2
name: mongodb-operator
description: A Kubernetes Operator for MongoDB — ReplicaSets, Sharded Clusters with auto scale-out, S3/PVC Backup, TLS, and LDAP. MIT licensed.
type: application
version: 1.16.1
appVersion: "1.16.1"
kubeVersion: ">=1.26.0-0"

keywords:
  - mongodb
  - database
  - nosql
  - operator
  - replicaset
  - sharded-cluster
  - backup
  - kubernetes
  - external-secrets
  - mongodb-operator
  - kubernetes-operator
  - mongodb-backup
  - pitr
  - ldap
  - mongos
  - helm

home: https://github.com/keiailab/mongodb-operator

sources:
  - https://github.com/keiailab/mongodb-operator

maintainers:
  - name: Keiailab
    email: support@keiailab.com
    url: https://keiailab.com

icon: https://raw.githubusercontent.com/KeiaiLab/mongodb-operator/main/docs/branding/symbol.png

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: database
  artifacthub.io/maturity: stable
  artifacthub.io/operator: "true"
  artifacthub.io/signKey: |
    fingerprint: F1A6893583E632A757FF6767F3CC8C6AEC9CEB08
    url: https://raw.githubusercontent.com/KeiaiLab/mongodb-operator/main/charts/keiailab-helm-signing-public.asc
  # operatorCapabilities — OperatorHub Phase V "Auto Pilot" 격상.
  # Level I-IV (45/66) 완료에 추가로 v1.10.0에서 Level V 14건 (A 5건 + B 9건) 구현:
  #   A1: HPA opt-in gate — 기존 reconcileMongosHPA 활성화 경로
  #   A2: AutoScalingSpec webhook validation
  #   A3: MissingIndex 자동 createIndex action (insights/auto_action.go)
  #   A4: SlowQueryPattern 자동 query hint (insights/auto_action.go)
  #   A5: Replication lag → unhealthy member detection (controller/auto_healing.go)
  #   B1: Shard auto-scaling (chunk imbalance) — controller/auto_scaling.go
  #   B2: Oplog window 기반 secondary 추가 — controller/auto_scaling.go
  #   B3: Pod CrashLoopBackOff threshold → RemoveMember
  #   B4: RS member unhealthy → reconfig
  #   B5: PVC 사용률 threshold → expand
  #   B6: Traffic spike detection — controller/auto_anomaly.go
  #   B7: Auth failure spike detection — controller/auto_anomaly.go
  #   B8/B9: Cross-cluster failover + global LB — federation_controller
  # 단위 테스트 21건 추가 (auto_action_test.go + autopilot_test.go) 전부 PASS.
  # CRD 확장: AutoPilotSpec (Enabled=false 기본, opt-in).
  artifacthub.io/operatorCapabilities: Auto Pilot
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/keiailab/mongodb-operator/blob/main/README.md
    - name: Source Code
      url: https://github.com/keiailab/mongodb-operator
    - name: MongoDB Documentation
      url: https://www.mongodb.com/docs/
    - name: Design Assets
      url: https://github.com/KeiaiLab/mongodb-operator/blob/main/docs/BRANDING.md
  artifacthub.io/screenshots: |
    - title: Keiailab MongoDB Operator centered service symbol
      url: https://raw.githubusercontent.com/KeiaiLab/mongodb-operator/main/docs/branding/symbol.png
    - title: Keiailab MongoDB Operator social cover
      url: https://raw.githubusercontent.com/KeiaiLab/mongodb-operator/main/docs/branding/cover.png
  artifacthub.io/crds: |
    - kind: MongoDB
      version: v1alpha1
      name: mongodbs.mongodb.keiailab.com
      displayName: MongoDB ReplicaSet
      description: Deploys and manages a MongoDB ReplicaSet cluster
    - kind: MongoDBSharded
      version: v1alpha1
      name: mongodbshardeds.mongodb.keiailab.com
      displayName: MongoDB Sharded Cluster
      description: Deploys and manages a MongoDB Sharded cluster with config servers, shards, and mongos routers
    - kind: MongoDBBackup
      version: v1alpha1
      name: mongodbbackups.mongodb.keiailab.com
      displayName: MongoDB Backup
      description: Creates and manages MongoDB backups to S3 or PVC storage
  artifacthub.io/crdsExamples: |
    - apiVersion: mongodb.keiailab.com/v1alpha1
      kind: MongoDB
      metadata:
        name: my-mongodb
        namespace: database
      spec:
        members: 3
        version:
          version: "8.3.1"
        storage:
          storageClassName: standard
          size: 10Gi
        auth:
          mechanism: SCRAM-SHA-256
          adminCredentialsSecretRef:
            name: mongodb-admin
        monitoring:
          enabled: true
    - apiVersion: mongodb.keiailab.com/v1alpha1
      kind: MongoDBSharded
      metadata:
        name: my-sharded
        namespace: database
      spec:
        version:
          version: "8.3.1"
        configServer:
          members: 3
          storage:
            size: 5Gi
        shards:
          count: 2
          membersPerShard: 3
          storage:
            size: 20Gi
        mongos:
          replicas: 2
    - apiVersion: mongodb.keiailab.com/v1alpha1
      kind: MongoDBBackup
      metadata:
        name: my-backup
        namespace: database
      spec:
        clusterRef:
          name: my-mongodb
          kind: MongoDB
        type: full
        compression: true
        storage:
          type: s3
          s3:
            bucket: mongodb-backups
            endpoint: https://s3.amazonaws.com
            credentialsRef:
              name: s3-credentials
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: mongodb-operator
      image: ghcr.io/keiailab/mongodb-operator:v1.16.1
    - name: mongodb
      image: mongo:8.3.1
    - name: mongodb-exporter
      image: percona/mongodb_exporter:0.51.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "MongoDB Search on TLS clusters no longer crashes the mongot sidecar on config parse. The mongod↔mongot in-pod gRPC and the mongot→mongod syncSource now use plaintext localhost (server.grpc.tls.mode=DISABLED + syncSource tls=false) instead of the invalid 'requireTLS' value; cluster TLS still applies to client and replication paths."
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager

dependencies:
  - name: keiailab-commons
    version: 0.8.0
    repository: oci://ghcr.io/keiailab/charts
