apiVersion: v2
name: mongodb-operator
description: A Kubernetes Operator for managing MongoDB ReplicaSets and Sharded Clusters (v1.0.0 GA Release)
type: application
version: 1.3.2-beta.1
appVersion: "1.3.2-beta.1"
kubeVersion: ">=1.26.0-0"

keywords:
  - mongodb
  - database
  - nosql
  - operator
  - replicaset
  - sharded-cluster
  - backup
  - kubernetes

home: https://github.com/keiailab/mongodb-operator

sources:
  - https://github.com/keiailab/mongodb-operator

maintainers:
  - name: Keiailab
    email: support@keiailab.com
    url: https://keiailab.com

icon: https://raw.githubusercontent.com/mongodb/mongo/master/docs/leaf.svg

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: database
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/keiailab/mongodb-operator/blob/main/README.md
    - name: Source Code
      url: https://github.com/keiailab/mongodb-operator
    - name: MongoDB Documentation
      url: https://www.mongodb.com/docs/
  artifacthub.io/crds: |
    - kind: MongoDB
      version: v1alpha1
      name: mongodbs.mongodb.keiailab.com
      displayName: MongoDB ReplicaSet
      description: Deploys and manages a MongoDB ReplicaSet cluster
    - kind: MongoDBSharded
      version: v1alpha1
      name: mongodbshardeds.mongodb.keiailab.com
      displayName: MongoDB Sharded Cluster
      description: Deploys and manages a MongoDB Sharded cluster with config servers, shards, and mongos routers
    - kind: MongoDBBackup
      version: v1alpha1
      name: mongodbbackups.mongodb.keiailab.com
      displayName: MongoDB Backup
      description: Creates and manages MongoDB backups to S3 or PVC storage
  artifacthub.io/crdsExamples: |
    - apiVersion: mongodb.keiailab.com/v1alpha1
      kind: MongoDB
      metadata:
        name: my-mongodb
        namespace: database
      spec:
        members: 3
        version:
          version: "8.2"
        storage:
          storageClassName: standard
          size: 10Gi
        auth:
          mechanism: SCRAM-SHA-256
          adminCredentialsSecretRef:
            name: mongodb-admin
        monitoring:
          enabled: true
    - apiVersion: mongodb.keiailab.com/v1alpha1
      kind: MongoDBSharded
      metadata:
        name: my-sharded
        namespace: database
      spec:
        version:
          version: "8.2"
        configServer:
          members: 3
          storage:
            size: 5Gi
        shards:
          count: 2
          membersPerShard: 3
          storage:
            size: 20Gi
        mongos:
          replicas: 2
    - apiVersion: mongodb.keiailab.com/v1alpha1
      kind: MongoDBBackup
      metadata:
        name: my-backup
        namespace: database
      spec:
        clusterRef:
          name: my-mongodb
          kind: MongoDB
        type: full
        compression: true
        storage:
          type: s3
          s3:
            bucket: mongodb-backups
            endpoint: https://s3.amazonaws.com
            credentialsRef:
              name: s3-credentials
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: mongodb-operator
      image: ghcr.io/keiailab/mongodb-operator:1.3.2-beta.1
    - name: mongodb
      image: mongo:8.2
    - name: mongodb-exporter
      image: percona/mongodb_exporter:0.40
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: fixed
      description: Helm repository URL과 GHCR image owner를 keiailab로 정정 (이전 publish 경로 복구)
    - kind: added
      description: HorizontalPodAutoscaler 자동화 — RS/cfg/mongos 이중 가드 + drift 방지 + status 노출
    - kind: added
      description: PodDisruptionBudget automation for MongoDB ReplicaSet and MongoDBSharded (opt-in)
    - kind: added
      description: NetworkPolicy automation with deny-by-default + additional ingress peers (opt-in)
    - kind: added
      description: MongoDBSharded Scale-in via removeShard with ShardDraining condition + resource cleanup
    - kind: added
      description: envtest-based controller integration regression suite
    - kind: changed
      description: Bootstrap admin user is race-free via Kubernetes Lease distributed lock + post-bootstrap usersInfo verify
    - kind: changed
      description: Auth error detection migrated to typed mongo.ServerError (HasErrorCode 13/18/11000/51003) with message fallback
    - kind: changed
      description: Self-managed createOrUpdate replaced with controllerutil.CreateOrUpdate(mutateFn) — eliminates Spec drift on partial mutations
    - kind: fixed
      description: ReconcileError condition no longer accumulates on repeated failures
    - kind: fixed
      description: updateStatus no longer silently skips primary probe errors — surfaces PrimaryUnreachable condition
    - kind: fixed
      description: isClusterReady rejects partial-status and zero-spec configurations
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager

dependencies: []
