apiVersion: v2
name: mongodb-operator
description: A Kubernetes Operator for managing MongoDB ReplicaSets and Sharded Clusters (v1.0.0 GA Release)
type: application
version: 1.11.0
appVersion: "1.11.0"
kubeVersion: ">=1.26.0-0"

keywords:
  - mongodb
  - database
  - nosql
  - operator
  - replicaset
  - sharded-cluster
  - backup
  - kubernetes

home: https://github.com/keiailab/mongodb-operator

sources:
  - https://github.com/keiailab/mongodb-operator

maintainers:
  - name: Keiailab
    email: support@keiailab.com
    url: https://keiailab.com

icon: https://raw.githubusercontent.com/mongodb/mongo/master/docs/leaf.svg

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: database
  artifacthub.io/maturity: stable
  artifacthub.io/operator: "true"
  artifacthub.io/signKey: |
    fingerprint: 89A409476828CB992338C378651E51AF520BCB78
    url: https://github.com/keiailab.gpg
  # operatorCapabilities — OperatorHub Phase V "Auto Pilot" 격상.
  # Level I-IV (45/66) 완료에 추가로 v1.10.0에서 Level V 14건 (A 5건 + B 9건) 구현:
  #   A1: HPA opt-in gate — 기존 reconcileMongosHPA 활성화 경로
  #   A2: AutoScalingSpec webhook validation
  #   A3: MissingIndex 자동 createIndex action (insights/auto_action.go)
  #   A4: SlowQueryPattern 자동 query hint (insights/auto_action.go)
  #   A5: Replication lag → unhealthy member detection (controller/auto_healing.go)
  #   B1: Shard auto-scaling (chunk imbalance) — controller/auto_scaling.go
  #   B2: Oplog window 기반 secondary 추가 — controller/auto_scaling.go
  #   B3: Pod CrashLoopBackOff threshold → RemoveMember
  #   B4: RS member unhealthy → reconfig
  #   B5: PVC 사용률 threshold → expand
  #   B6: Traffic spike detection — controller/auto_anomaly.go
  #   B7: Auth failure spike detection — controller/auto_anomaly.go
  #   B8/B9: Cross-cluster failover + global LB — federation_controller
  # 단위 테스트 21건 추가 (auto_action_test.go + autopilot_test.go) 전부 PASS.
  # CRD 확장: AutoPilotSpec (Enabled=false 기본, opt-in).
  artifacthub.io/operatorCapabilities: Auto Pilot
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/keiailab/mongodb-operator/blob/main/README.md
    - name: Source Code
      url: https://github.com/keiailab/mongodb-operator
    - name: MongoDB Documentation
      url: https://www.mongodb.com/docs/
  artifacthub.io/crds: |
    - kind: MongoDB
      version: v1alpha1
      name: mongodbs.mongodb.keiailab.com
      displayName: MongoDB ReplicaSet
      description: Deploys and manages a MongoDB ReplicaSet cluster
    - kind: MongoDBSharded
      version: v1alpha1
      name: mongodbshardeds.mongodb.keiailab.com
      displayName: MongoDB Sharded Cluster
      description: Deploys and manages a MongoDB Sharded cluster with config servers, shards, and mongos routers
    - kind: MongoDBBackup
      version: v1alpha1
      name: mongodbbackups.mongodb.keiailab.com
      displayName: MongoDB Backup
      description: Creates and manages MongoDB backups to S3 or PVC storage
  artifacthub.io/crdsExamples: |
    - apiVersion: mongodb.keiailab.com/v1alpha1
      kind: MongoDB
      metadata:
        name: my-mongodb
        namespace: database
      spec:
        members: 3
        version:
          version: "8.3.1"
        storage:
          storageClassName: standard
          size: 10Gi
        auth:
          mechanism: SCRAM-SHA-256
          adminCredentialsSecretRef:
            name: mongodb-admin
        monitoring:
          enabled: true
    - apiVersion: mongodb.keiailab.com/v1alpha1
      kind: MongoDBSharded
      metadata:
        name: my-sharded
        namespace: database
      spec:
        version:
          version: "8.3.1"
        configServer:
          members: 3
          storage:
            size: 5Gi
        shards:
          count: 2
          membersPerShard: 3
          storage:
            size: 20Gi
        mongos:
          replicas: 2
    - apiVersion: mongodb.keiailab.com/v1alpha1
      kind: MongoDBBackup
      metadata:
        name: my-backup
        namespace: database
      spec:
        clusterRef:
          name: my-mongodb
          kind: MongoDB
        type: full
        compression: true
        storage:
          type: s3
          s3:
            bucket: mongodb-backups
            endpoint: https://s3.amazonaws.com
            credentialsRef:
              name: s3-credentials
  # containsSecurityUpdates: 버전별 토글 정책 (artifacthub.io 공식 권장).
  # v1.10.0/1.10.1: Auto Pilot feature only — 보안 수정 0건. "false".
  # v1.10.3: artifacthub.io/images annotation tag mismatch fix — 보안 수정 0건. "false".
  # v1.11.0: 보안 결함 다수 fix (PSA restricted / exporter secret URL 인코딩 /
  #          webhook S3 검증 / audit YAML 이스케이프 / bitnami 이미지 제거) → "true".
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: mongodb-operator
      image: ghcr.io/keiailab/mongodb-operator:v1.11.0
    - name: mongodb
      image: mongo:8.3.1
    - name: mongodb-exporter
      image: percona/mongodb_exporter:0.51.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "백업 검증(MongoDBBackupVerification) Verifying 단계 실 구현 — 복원 대상에 실제 연결하여 SampleQueries 의 문서 수가 MinExpectedDocs 이상인지 검증(기존 STUB: 쿼리 미실행 + 항상 통과). NewClientFromURI + docCounter 인터페이스로 단위 테스트 가능."
    - kind: fixed
      description: "[CRITICAL] BuildRestoreJob 이 backup.Spec.Restore 를 nil 가드 없이 역참조해 일반 백업 verify 시 controller panic/CrashLoop 되던 결함 fix(시그니처 (*Job,error) + nil 가드 + 호출처 에러 처리)."
    - kind: fixed
      description: "updateStatusWithRetry 가 conflict 시 refetch 로 호출자 status mutation 을 silent 유실하던 결함 fix(variadic mutate 재적용, 호출처 42곳 마이그레이션)."
    - kind: fixed
      description: "reconcile 정확성 14건 — Get 에러 NotFound 미구분, Spec→Status update 순서, UpgradeStartTime 덮어쓰기, IsValidUpgradePath 정렬 미보장, JWKS 비-EOF 오류 무시, federation status update silent 무시, insights Gauge 오용, sharding compound key 순서 등."
    - kind: security
      description: "exporter secret URI 의 username 무검증 + 패스워드 URL 미인코딩 fix(ok-idiom + url.UserPassword). PSA restricted 위반(volume permissions init RunAsUser=0+CHOWN / queryable StatefulSet SecurityContext 누락) → restricted helper 적용."
    - kind: security
      description: "webhook backup type=s3 인데 S3 config nil 일 때 검증 통과하던 결함 fix(field.Required). audit 의 사용자 CRD 필드 YAML 비이스케이프 삽입 → sigs.k8s.io/yaml Marshal 안전 인코딩."
    - kind: security
      description: "bitnami/kubectl:latest 이미지 제거 → registry.k8s.io/kubectl:v1.31.0(불변 태그 + 공급망 정책 정합)."
    - kind: changed
      description: "운영 로그 기본값 production(JSON, zap Development:false), 죽은 코드 제거(okFloat/hasRegionStatus), HTTP transport 유휴연결 누수 정리."
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager

dependencies: []
