{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mongodb-operator.fullname" . }}
  labels:
    {{- include "mongodb-operator.labels" . | nindent 4 }}
rules:
  # MongoDB ReplicaSet CRD (always enabled)
  - apiGroups:
      - mongodb.keiailab.com
    resources:
      - mongodbs
      {{- if .Values.features.sharded.enabled }}
      - mongodbshardeds
      {{- end }}
      {{- if .Values.features.backup.enabled }}
      - mongodbbackups
      {{- end }}
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - mongodb.keiailab.com
    resources:
      - mongodbs/status
      {{- if .Values.features.sharded.enabled }}
      - mongodbshardeds/status
      {{- end }}
      {{- if .Values.features.backup.enabled }}
      - mongodbbackups/status
      {{- end }}
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - mongodb.keiailab.com
    resources:
      - mongodbs/finalizers
      {{- if .Values.features.sharded.enabled }}
      - mongodbshardeds/finalizers
      {{- end }}
      {{- if .Values.features.backup.enabled }}
      - mongodbbackups/finalizers
      {{- end }}
    verbs:
      - update

  # Core resources
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - endpoints
      - persistentvolumeclaims
      - events
      - configmaps
      - secrets
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Apps resources
  - apiGroups:
      - apps
    resources:
      - statefulsets
      {{- if .Values.features.sharded.enabled }}
      - deployments
      - replicasets
      {{- end }}
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  {{- if .Values.features.backup.enabled }}

  # Batch resources (for backup jobs) — gated by features.backup.enabled
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  {{- end }}

  # Autoscaling (HPA) read verbs — ALWAYS granted, regardless of
  # features.autoscaling.enabled. MongoDBReconciler / MongoDBShardedReconciler
  # call ctrl.NewControllerManagedBy(mgr).Owns(&autoscalingv2.HorizontalPodAutoscaler{})
  # unconditionally (enforced by TestSetupWithManager_RegistersHPAOwns), so the
  # cached informer must be able to list/watch HPAs at startup. Without these
  # verbs the manager fails cache sync (`failed to wait for caches to sync kind
  # source: *v2.HorizontalPodAutoscaler`) and CrashLoopBackOff's. Reconcile-time
  # writes are still gated below by features.autoscaling.enabled.
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch

  {{- if .Values.features.autoscaling.enabled }}

  # Autoscaling (HPA) write verbs — gated by features.autoscaling.enabled.
  # Only the autoscaling reconcile path (reconcileRSHPA / reconcileMongosHPA /
  # reconcileConfigServerHPA) creates/updates HPAs; with the gate off those
  # paths are no-ops, so write verbs are unnecessary.
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - patch
      - update
  {{- end }}

  # Policy (for PDB)
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Networking (for NetworkPolicy)
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # cert-manager (for TLS)
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
      - issuers
      - clusterissuers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Prometheus monitoring
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
      - prometheusrules
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Coordination (for leader election)
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
{{- end }}
