apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mongodb-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # cycle 26 rule_85 — revision history limit (k8s default 10 → 3)
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  # cycle 26 rule_73 — HA min ready seconds (rolling update graceful)
  minReadySeconds: {{ .Values.minReadySeconds | default 10 }}
  selector:
    matchLabels:
      {{- include "mongodb-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mongodb-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # cycle 26 rule_84 operator 예외 — operator pod 는 SA token mount 필수
      # (controller-runtime in-cluster config, incident-kb §10 / INC-0002).
      # RFC-0027 안전 패턴: nil → true (operator 기본 동작 보존) / 명시 false → false.
      automountServiceAccountToken: {{ ne .Values.automountServiceAccountToken false }}
      serviceAccountName: {{ include "mongodb-operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- include "keiailab.security.podSecurityContext" (dict "override" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "mongodb-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- if .Values.leaderElection.namespace }}
            - --leader-election-namespace={{ .Values.leaderElection.namespace }}
            {{- end }}
            {{- end }}
            - --health-probe-bind-address=:{{ .Values.service.healthPort }}
            - --metrics-bind-address=:{{ .Values.service.metricsPort }}
            {{- if .Values.metrics.secure }}
            - --metrics-secure=true
            {{- end }}
            {{- if .Values.logging.level }}
            - --zap-log-level={{ .Values.logging.level }}
            {{- end }}
            {{- if .Values.logging.development }}
            - --zap-devel=true
            {{- end }}
            # Feature gates (v1.3.2-beta.x carve-out — values.features 참조)
            {{- if .Values.features.sharded.enabled }}
            - --enable-sharded-controller=true
            {{- end }}
            {{- if .Values.features.backup.enabled }}
            - --enable-backup-controller=true
            {{- end }}
            {{- if .Values.features.insights.enabled }}
            - --enable-insights-controller=true
            {{- end }}
            {{- if .Values.features.federation.enabled }}
            - --enable-federation-controller=true
            {{- end }}
            {{- if .Values.features.clustergroup.enabled }}
            - --enable-clustergroup-controller=true
            {{- end }}
            {{- if .Values.features.autoscaling.enabled }}
            - --enable-autoscaling=true
            {{- end }}
            {{- if .Values.features.search.enabled }}
            - --enable-search-controller=true
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - --enable-webhooks=true
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.healthPort }}
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port | default 9443 }}
              protocol: TCP
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- include "keiailab.security.containerSecurityContext" (dict "override" .) | nindent 12 }}
          {{- end }}
          {{- if .Values.customLivenessProbe }}
          livenessProbe:
            {{- toYaml .Values.customLivenessProbe | nindent 12 }}
          {{- else }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.healthPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.customReadinessProbe }}
          readinessProbe:
            {{- toYaml .Values.customReadinessProbe | nindent 12 }}
          {{- else }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.healthPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycleHooks }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.mongodb.version }}
            - name: DEFAULT_MONGODB_VERSION
              value: {{ .Values.mongodb.version | quote }}
            {{- end }}
            {{- if .Values.mongodb.exporterImage }}
            - name: MONGODB_EXPORTER_IMAGE
              value: {{ .Values.mongodb.exporterImage | quote }}
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.extraEnvVarsCM .Values.extraEnvVarsSecret }}
          envFrom:
            {{- range .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .name }}
                {{- if hasKey . "optional" }}
                optional: {{ .optional }}
                {{- end }}
            {{- end }}
            {{- range .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .name }}
                {{- if hasKey . "optional" }}
                optional: {{ .optional }}
                {{- end }}
            {{- end }}
          {{- end }}
          {{- if or .Values.extraVolumeMounts .Values.webhook.enabled }}
          volumeMounts:
            {{- if .Values.webhook.enabled }}
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.extraVolumes .Values.webhook.enabled }}
      volumes:
        {{- if .Values.webhook.enabled }}
        - name: webhook-cert
          secret:
            secretName: {{ printf "%s-webhook-server-cert" (include "mongodb-operator.fullname" .) }}
            defaultMode: 0444
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 10 }}
