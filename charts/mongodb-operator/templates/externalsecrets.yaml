    name: {{ required "externalSecrets.backupS3.targetName is required" .Values.externalSecrets.backupS3.targetName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.backupS3.accessKeyKey | quote }}
      remoteRef:
        key: {{ required "externalSecrets.backupS3.accessKeyRemoteKey is required" .Values.externalSecrets.backupS3.accessKeyRemoteKey | quote }}
    - secretKey: {{ .Values.externalSecrets.backupS3.secretKeyKey | quote }}
      remoteRef:
        key: {{ required "externalSecrets.backupS3.secretKeyRemoteKey is required" .Values.externalSecrets.backupS3.secretKeyRemoteKey | quote }}
{{- end }}
