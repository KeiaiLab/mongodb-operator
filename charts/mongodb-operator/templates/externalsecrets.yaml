{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.admin.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "externalSecrets.admin.name is required" .Values.externalSecrets.admin.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb-operator.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | quote }}
    name: {{ required "externalSecrets.secretStoreName is required" .Values.externalSecrets.secretStoreName | quote }}
  target:
    name: {{ required "externalSecrets.admin.targetName is required" .Values.externalSecrets.admin.targetName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.admin.usernameKey | quote }}
      remoteRef:
        key: {{ required "externalSecrets.admin.usernameRemoteKey is required" .Values.externalSecrets.admin.usernameRemoteKey | quote }}
    - secretKey: {{ .Values.externalSecrets.admin.passwordKey | quote }}
      remoteRef:
        key: {{ required "externalSecrets.admin.passwordRemoteKey is required" .Values.externalSecrets.admin.passwordRemoteKey | quote }}
{{- end }}
