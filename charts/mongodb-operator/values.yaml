---
# MongoDB Operator Helm Chart Values
# This is a YAML-formatted file.

# -- Number of operator replicas
replicaCount: 1

# -- Deployment revisionHistoryLimit (cycle 26 rule_85; k8s default 10 → 3)
revisionHistoryLimit: 3

# -- Deployment minReadySeconds for graceful rolling updates (cycle 26 rule_73)
minReadySeconds: 10

# -- Mount the ServiceAccount token into the operator pod.
# The operator needs in-cluster config (controller-runtime), so this stays
# true by default (incident-kb §10 / INC-0002 operator SA-token exception).
# Set to false only if you wire credentials by another mechanism.
automountServiceAccountToken: true

# Operator image configuration
image:
  # -- Image repository
  repository: harbor.keiailab.dev/keiailab/platform/mongodb-operator
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default: chart appVersion)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""

# -- Override the full name of the chart
fullnameOverride: ""

# ServiceAccount configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use
  name: ""

# -- Additional annotations for the operator deployment
podAnnotations: {}

# -- Additional labels for the operator deployment
podLabels: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# Operator service configuration
service:
  # -- Service type
  type: ClusterIP
  # -- Metrics port
  metricsPort: 8443
  # -- Health probe port
  healthPort: 8081

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Node selector for operator pod scheduling
nodeSelector: {}

# -- Tolerations for operator pod scheduling
tolerations: []

# -- Affinity rules for operator pod scheduling
affinity: {}

# -- Topology spread constraints for operator pod scheduling
topologySpreadConstraints: []

# -- Priority class name for operator pod (e.g., system-cluster-critical)
priorityClassName: ""

# -- Runtime class name for operator pod (e.g., gvisor, kata)
runtimeClassName: ""

# -- DNS policy (ClusterFirst, ClusterFirstWithHostNet, Default, None)
dnsPolicy: ""

# -- DNS config — used when dnsPolicy=None or supplemental config
dnsConfig: {}

# -- Host aliases — additional /etc/hosts entries
hostAliases: []

# -- Termination grace period seconds (default 30 — k8s default)
terminationGracePeriodSeconds: null

# -- Operator container additional environment variables (raw EnvVar list)
extraEnvVars: []
# Example:
#   - name: GOMEMLIMIT
#     value: "400MiB"

# -- Operator container additional env vars from ConfigMaps (raw EnvFromSource ConfigMapRef list)
extraEnvVarsCM: []
# Example:
#   - name: my-config

# -- Operator container additional env vars from Secrets (raw EnvFromSource SecretRef list)
extraEnvVarsSecret: []

# -- Additional volumes mounted into the operator pod (raw Volume list)
extraVolumes: []
# Example:
#   - name: ca-bundle
#     configMap:
#       name: my-ca-bundle

# -- Additional volume mounts on the operator container (raw VolumeMount list)
extraVolumeMounts: []
# Example:
#   - name: ca-bundle
#     mountPath: /etc/ssl/custom-ca.pem
#     subPath: ca.pem
#     readOnly: true

# -- Additional init containers (raw Container list)
extraInitContainers: []

# -- Additional sidecar containers running alongside the operator (raw Container list)
sidecars: []

# -- Custom liveness probe (overrides default if non-empty)
customLivenessProbe: {}

# -- Custom readiness probe (overrides default if non-empty)
customReadinessProbe: {}

# -- Custom startup probe
customStartupProbe: {}

# -- Container lifecycle hooks (postStart / preStop)
lifecycleHooks: {}

# Leader election configuration
leaderElection:
  # -- Enable leader election for controller manager
  enabled: true
  # -- Namespace for leader election lease
  namespace: ""

# Metrics configuration
metrics:
  # -- Enable metrics endpoint
  enabled: true
  # -- Enable secure metrics (HTTPS)
  secure: true
  # -- Create ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: true
    # -- ServiceMonitor scrape interval
    interval: 30s
    # -- Additional labels for ServiceMonitor
    labels: {}
    # -- Metric relabeling configs
    metricRelabelings: []
    # -- Relabeling configs
    relabelings: []
    # -- Override scrape scheme (http|https). Empty = derive from metrics.secure.
    scheme: ""
    # -- Path to bearer token file mounted in Prometheus pod
    # When metrics.secure=true and the operator stays behind kube-rbac-proxy,
    # use Prometheus SA token. Example: /var/run/secrets/kubernetes.io/serviceaccount/token
    bearerTokenFile: ""
    # -- Prometheus Operator authorization config (preferred over bearerTokenFile)
    # https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#monitoring.coreos.com/v1.SafeAuthorization
    # Example:
    #   authorization:
    #     credentials:
    #       name: prometheus-bearer
    #       key: token
    authorization: {}
    # -- TLS config for secure endpoints. Empty = chart default (insecureSkipVerify controlled below).
    # Override to pin a CA or ServerName.
    tlsConfig: {}
    # -- Skip TLS verification for metrics endpoint when metrics.secure=true and tlsConfig is empty.
    # Set to false and provide tlsConfig.ca for production.
    insecureSkipVerify: true

# Monitoring configuration (PR #162 PrometheusRule, bitnami mongodb-sharded parity)
# 별도 top-level 블록 — metrics.serviceMonitor 와 의도적으로 분리:
#   metrics.*           = ServiceMonitor (Prometheus scrape target)
#   monitoring.*        = PrometheusRule (alert rules)
monitoring:
  # -- Enable monitoring CRD rendering (master switch for PrometheusRule)
  # default false = opt-in. prometheus-operator CRD 미설치 환경에서 helm install 거절 차단.
  enabled: false
  # PrometheusRule for 8-alert pack (operator health + replica set state + member churn)
  prometheusRule:
    # -- Enable PrometheusRule rendering (requires monitoring.enabled)
    enabled: false

# Webhook configuration (for future use)
webhook:
  # -- Enable admission webhooks
  enabled: false
  # -- Webhook service port
  port: 9443

# RBAC configuration
rbac:
  # -- Create RBAC resources
  create: true
  # -- Use ClusterRole (true) or Role (false)
  clusterScope: true

# CRD configuration
crds:
  # -- Install CRDs with the chart
  install: true
  # -- Keep CRDs on chart uninstall
  keep: true

# MongoDB default configuration (used as defaults for MongoDB CRs)
mongodb:
  # -- Default MongoDB version
  version: "8.3.1"
  # -- Default storage class
  storageClassName: ""
  # -- Default exporter image for monitoring
  exporterImage: percona/mongodb_exporter:0.51.0

# External Secrets Operator integration.
# 기본값은 false: 기존처럼 CRD 의 SecretRef 이름만 사용한다.
# enabled=true 시 chart 가 ExternalSecret 을 생성해 Infisical/ESO 에서
# Kubernetes Secret 을 materialize 한다.
externalSecrets:
  enabled: false
  secretStoreKind: ClusterSecretStore
  secretStoreName: infisical
  refreshInterval: 1h
  admin:
    enabled: false
    name: mongodb-admin-credentials
    targetName: mongodb-admin-credentials
    usernameKey: username
    passwordKey: password
    usernameRemoteKey: /data/mongodb/admin/username
    passwordRemoteKey: /data/mongodb/admin/password
  app:
    enabled: false
    name: mongodb-app-credentials
    targetName: mongodb-app-credentials
    usernameKey: username
    passwordKey: password
    usernameRemoteKey: /data/mongodb/app/username
    passwordRemoteKey: /data/mongodb/app/password
  backupS3:
    enabled: false
    name: ceph-objectstore-credentials
    targetName: ceph-objectstore-credentials
    accessKeyKey: access-key
    secretKeyKey: secret-key
    accessKeyRemoteKey: /data/mongodb/backup/access-key
    secretKeyRemoteKey: /data/mongodb/backup/secret-key

# Logging configuration
logging:
  # -- Log level (debug, info, error)
  level: info
  # -- Log format (json, console)
  format: json
  # -- Enable development mode logging
  development: false

# Watch configuration
watch:
  # -- Namespaces to watch (empty = all namespaces)
  namespaces: []

# Health probes configuration
probes:
  liveness:
    # -- Initial delay seconds for liveness probe
    initialDelaySeconds: 15
    # -- Period seconds for liveness probe
    periodSeconds: 20
  readiness:
    # -- Initial delay seconds for readiness probe
    initialDelaySeconds: 5
    # -- Period seconds for readiness probe
    periodSeconds: 10

# ----------------------------------------------------------------------------
# Carve-out feature gates (v1.3.2-beta.1)
# 베타 출시 범위: ReplicaSet 한정. 다음 기능은 검증 미완료로 기본 비활성화.
# enable=true로 켤 경우 운영자가 잔여 위험을 인지한 것으로 간주됨 (CHANGELOG 참조).
# ----------------------------------------------------------------------------
features:
  # Sharded 모드 — v1.4.1에서 P1 2건 fix (HPA ordering + status truth source).
  # ADR-0010 참조. 베타 carve-out 종료. 운영 권장 path는 ReplicaSet이지만
  # Sharded는 모든 게이트(테스트·24h soak)를 통과해 default-on.
  sharded:
    enabled: true
  # Backup 컨트롤러 — 자동 테스트 0건. connectionString 평문 노출(P0). 베타 미지원.
  backup:
    enabled: false
  # Insights — 쿼리 프로파일링 advisory (DryRun 기본, read-only 분석). cycle 7 F51-F55 + cycle 9 P1.
  insights:
    enabled: false
  # Federation (다중 리전) — skeleton (cross-cluster bind 후속). CR 없으면 no-op. cycle 5 F33-F37.
  federation:
    enabled: false
  # ClusterGroup (멀티 클러스터) — skeleton (cross-cluster propagation 후속). CR 없으면 no-op. cycle 8 F56-F60.
  clustergroup:
    enabled: false
  # Auto-scaling (HPA) — RS/cfg drift 방지 mutex 부재(P1). 베타 미지원.
  autoscaling:
    enabled: false
  # MongoDBSearch (mongot) — self-managed Search/Vector Search. sidecar+PVC fix 검증 완료
  # (kind e2e: 인덱스 READY + $vectorSearch). default-on. mongot 엔진은 MongoDB upstream
  # public preview. MongoDBSearch CR opt-in이라 CR 없으면 기존 mongod 무영향(무롤링).
  search:
    enabled: true

# Network Policy configuration
# ⚠ Production: set enabled=true for deny-by-default network isolation
networkPolicy:
  # -- Enable network policy
  enabled: false
  # -- Ingress rules
  ingress: []
  # -- Egress rules
  egress: []

# Pod Disruption Budget configuration
# default false (valkey-operator parity): the operator is a stateless,
# leader-elected single replica (replicaCount: 1). With enabled=true +
# minAvailable: 1 + replicaCount: 1 the PDB yields 0 ALLOWED DISRUPTIONS,
# permanently blocking node drains. Enable only when running >1 replica.
podDisruptionBudget:
  # -- Enable PodDisruptionBudget (enable only with replicaCount > 1)
  enabled: false
  # -- Minimum available pods
  minAvailable: 1
  # -- Maximum unavailable pods
  maxUnavailable: ""

# F10 (cycle 2): Grafana dashboards — operator + cluster + replicaset +
# sharded + operational + backup 5종. ConfigMap 으로 노출, Grafana
# Operator sidecar 가 label watch 로 자동 import.
grafana:
  dashboards:
    # -- Provision 5 mongodb-operator dashboards as a ConfigMap
    enabled: false
    # -- Labels picked up by Grafana sidecar (default kube-prometheus-stack)
    labels:
      grafana_dashboard: "1"
    # -- Override namespace (default: Release namespace)
    namespace: ""

# Vault Transit KMS encryption-at-rest integration.
# cycle 17 internal/auth/vault-transit/ SDK 가 Vault 와 통신하며, 본 values 의
# 활성 시 operator 가 MongoDB CR spec.encryption.vaultTransit reference 로
# Vault address + Token Secret 을 자동 inject 한다. AppRole / Token / Kubernetes
# auth 모든 mode 지원 (SDK 활성화).
#
# Bitnami parity: bitnami/mongodb chart 는 native Vault Transit 미지원 — 본
# operator 가 동등 또는 초과 (cycle 17 cross-cluster federation 동반).
vaultTransit:
  enabled: false
  # Vault address (e.g. https://vault.platform-security.svc.cluster.local:8200)
  endpoint: ""
  # Transit key path (e.g. transit/keys/mongodb-storage-key)
  keyName: ""
  # Auth mode: token | approle | kubernetes
  auth:
    mode: kubernetes
    # kubernetes auth role (Vault 의 role)
    role: mongodb-operator
    # Token Secret reference (mode=token)
    tokenSecretRef:
      name: ""
      key: token
    # AppRole secret reference (mode=approle)
    appRoleSecretRef:
      name: ""
