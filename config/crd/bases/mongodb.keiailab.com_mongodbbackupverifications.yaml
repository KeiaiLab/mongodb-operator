                  - reason
                  - status
                  - type
                  type: object
                type: array
              error:
                description: Error 실패 사유.
                type: string
              phase:
                description: 'Phase: Pending | Restoring | Verifying | Passed | Failed'
                enum:
                - Pending
                - Restoring
                - Verifying
                - Passed
                - Failed
                type: string
              queryResults:
                description: QueryResults 각 SampleQueries 의 row count + pass/fail.
                items:
                  description: VerificationQueryResult — 단일 query 결과.
