---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: mongodbfederations.mongodb.keiailab.com
spec:
  group: mongodb.keiailab.com
  names:
    kind: MongoDBFederation
    listKind: MongoDBFederationList
    plural: mongodbfederations
    shortNames:
    - mdbfed
    singular: mongodbfederation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.regions[*].name
      name: Regions
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MongoDBFederation is the Schema for the mongodbfederations API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MongoDBFederationSpec defines a multi-cluster MongoDB ReplicaSet
              topology.
            properties:
              auth:
                description: |-
                  Auth applies to the federated replica set (admin credentials must be
                  the same secret content across all cluster kubeconfigs).
                properties:
                  adminCredentialsSecretRef:
                    description: AdminCredentialsSecretRef references the admin credentials
                      secret
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  ldap:
                    description: |-
                      LDAP defines optional LDAP-backed enterprise authentication.
                      Mechanism 이 PLAIN 또는 SCRAM-SHA-256 일 때 sasl-passthrough 적용.
                    properties:
                      authorizationQueryTemplate:
                        description: |-
                          AuthorizationQueryTemplate is the LDAP query template for role
                          mapping. e.g. `{USER}?memberOf?base`.
                        type: string
                      bindCredentialsSecretRef:
                        description: |-
                          BindCredentialsSecretRef references LDAP service account credentials
                          (keys: bindDN / password) for user lookup.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      bindMethod:
                        default: simple
                        description: |-
                          BindMethod = simple | sasl. simple 은 bind DN + password, sasl 은
                          SASL mechanism (e.g. PLAIN).
                        enum:
                        - simple
                        - sasl
                        type: string
                      caSecretRef:
                        description: 'CASecretRef references the LDAP CA bundle (key:
                          ca.crt).'
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      servers:
                        description: |-
                          Servers is a comma-separated list of LDAP server hostnames
                          (host:port). MongoDB 가 client 로 접속할 LDAP server.
                        minLength: 1
                        type: string
                      tls:
                        default: true
                        description: |-
                          TLS enables LDAP over TLS (ldaps://). 별도 CA secret 필요 시
                          CASecretRef 사용.
                        type: boolean
                      userToDNMapping:
                        description: |-
                          UserToDNMapping is a MongoDB-format JSON array string for LDAP user
                          to DN transformation. e.g. `[{match:"(.+)",ldapQuery:"OU=Users,DC=ex,DC=com??sub?(uid={0})"}]`
                        type: string
                    required:
                    - servers
                    type: object
                  mechanism:
                    default: SCRAM-SHA-256
                    description: |-
                      Mechanism defines the auth mechanism. PLAIN 은 LDAP-backed
                      (sasl-passthrough), MONGODB-OIDC 는 OIDC IdP bind.
                    enum:
                    - SCRAM-SHA-256
                    - SCRAM-SHA-1
                    - X509
                    - PLAIN
                    - MONGODB-OIDC
                    type: string
                  oidc:
                    description: |-
                      OIDC defines optional OIDC / OAuth2 authentication.
                      Mechanism 이 MONGODB-OIDC 일 때 활성. Keycloak / Okta / Auth0
                      호환 — issuerURL + clientID 매핑.
                    properties:
                      clientID:
                        description: ClientID is the OIDC client identifier registered
                          with the IdP.
                        minLength: 1
                        type: string
                      identityProvider:
                        default: generic
                        description: SupportedIdentityProviders 정합 hint — IdP 호환 검증용.
                        enum:
                        - keycloak
                        - okta
                        - auth0
                        - google
                        - generic
                        type: string
                      issuerURL:
                        description: IssuerURL is the OIDC provider issuer (must match
                          `iss` claim).
                        minLength: 1
                        type: string
                      rolesClaim:
                        default: groups
                        description: |-
                          RolesClaim is the JWT claim that carries role memberships.
                          Default `groups`.
                        type: string
                      userClaim:
                        default: sub
                        description: UserClaim is the JWT claim used as MongoDB username.
                          Default `sub`.
                        type: string
                    required:
                    - clientID
                    - issuerURL
                    type: object
                  users:
                    description: Users defines additional users to create
                    items:
                      description: MongoDBUser defines a MongoDB user
                      properties:
                        db:
                          description: DB is the authentication database
                          type: string
                        name:
                          description: Name is the username
                          type: string
                        passwordSecretRef:
                          description: PasswordSecretRef references the password secret
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        roles:
                          description: Roles defines user roles
                          items:
                            description: MongoDBRole defines a MongoDB role
                            properties:
                              db:
                                description: DB is the database for the role
                                type: string
                              name:
                                description: Name is the role name
                                type: string
                            required:
                            - db
                            - name
                            type: object
                          type: array
                      required:
                      - db
                      - name
                      - passwordSecretRef
                      - roles
                      type: object
                    type: array
                required:
                - adminCredentialsSecretRef
                type: object
              regions:
                description: Regions defines per-cluster member configuration.
                items:
                  description: FederationRegion defines one cluster slice of the federation.
                  properties:
                    clusterKubeConfigRef:
                      description: |-
                        ClusterKubeConfigRef references a Secret in operator namespace with
                        key `kubeconfig` containing the target cluster credentials. Federation
                        controller uses this to manage remote MongoDB CR.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    members:
                      default: 2
                      description: Members is the number of MongoDB ReplicaSet members
                        in this region.
                      format: int32
                      minimum: 1
                      type: integer
                    name:
                      description: Name is the human-readable region identifier (e.g.
                        "us-west", "eu-central").
                      minLength: 1
                      type: string
                    priority:
                      default: "1.0"
                      description: |-
                        Priority is the MongoDB replica priority value (0.0-1000.0). Higher
                        priority members are preferred as primary. Use 0 to make a region
                        secondary-only (analytics / DR).
                      type: string
                    storage:
                      description: Storage applies to MongoDB pods in this region.
                      properties:
                        dataDirPath:
                          default: /data/db
                          description: DataDirPath is the path for MongoDB data
                          type: string
                        persistentVolumeClaimRetentionPolicy:
                          description: |-
                            PersistentVolumeClaimRetentionPolicy describes the lifecycle of PVCs
                            created from the StatefulSet's VolumeClaimTemplates. WhenDeleted/WhenScaled
                            모두 Retain(기본) 또는 Delete를 허용. 기본은 Retain — 운영자가 명시적으로
                            데이터 폐기를 선택하기 전까지 PVC를 보존하기 위함.
                          properties:
                            whenDeleted:
                              description: |-
                                WhenDeleted specifies what happens to PVCs created from StatefulSet
                                VolumeClaimTemplates when the StatefulSet is deleted. The default policy
                                of `Retain` causes PVCs to not be affected by StatefulSet deletion. The
                                `Delete` policy causes those PVCs to be deleted.
                              type: string
                            whenScaled:
                              description: |-
                                WhenScaled specifies what happens to PVCs created from StatefulSet
                                VolumeClaimTemplates when the StatefulSet is scaled down. The default
                                policy of `Retain` causes PVCs to not be affected by a scaledown. The
                                `Delete` policy causes the associated PVCs for any excess pods above
                                the replica count to be deleted.
                              type: string
                          type: object
                        size:
                          anyOf:
                          - type: integer
                          - type: string
                          default: 10Gi
                          description: Size is the storage size
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        storageClassName:
                          description: |-
                            StorageClassName is the name of the StorageClass
                            If not specified, the default storage class will be used
                          type: string
                      type: object
                    zone:
                      description: Zone is an optional zone tag for zone-aware sharding
                        routing.
                      type: string
                  required:
                  - clusterKubeConfigRef
                  - members
                  - name
                  type: object
                minItems: 2
                type: array
              tls:
                description: |-
                  TLS applies cluster-wide. cert-manager Issuer 가 각 cluster 에 동일
                  이름으로 존재한다고 가정.
                properties:
                  certManager:
                    description: CertManager enables cert-manager integration
                    properties:
                      duration:
                        default: 2160h
                        description: Duration is the certificate duration
                        type: string
                      issuerRef:
                        description: IssuerRef references a cert-manager Issuer or
                          ClusterIssuer
                        properties:
                          kind:
                            default: ClusterIssuer
                            description: Kind is the issuer kind (Issuer or ClusterIssuer)
                            enum:
                            - Issuer
                            - ClusterIssuer
                            type: string
                          name:
                            description: Name is the issuer name
                            type: string
                        required:
                        - kind
                        - name
                        type: object
                      renewBefore:
                        default: 360h
                        description: RenewBefore is when to renew before expiry
                        type: string
                    required:
                    - issuerRef
                    type: object
                  customCert:
                    description: CustomCert references a custom TLS secret
                    properties:
                      secretName:
                        description: SecretName is the name of the TLS secret
                        type: string
                    required:
                    - secretName
                    type: object
                  enabled:
                    default: true
                    description: Enabled enables TLS for MongoDB connections
                    type: boolean
                required:
                - enabled
                type: object
              version:
                description: Version is the MongoDB version applied to all regions.
                properties:
                  image:
                    description: Image is the MongoDB container image
                    type: string
                  version:
                    description: Version is the MongoDB version (e.g., "8.3.1")
                    pattern: ^\d+\.\d+(\.\d+)?$
                    type: string
                required:
                - version
                type: object
            required:
            - auth
            - regions
            - version
            type: object
          status:
            description: MongoDBFederationStatus is the observed federation state.
            properties:
              conditions:
                description: Conditions follow standard k8s convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              phase:
                description: 'Phase: Pending | Bootstrapping | Synced | Degraded |
                  Failed'
                enum:
                - Pending
                - Bootstrapping
                - Synced
                - Degraded
                - Failed
                type: string
              regionStatuses:
                description: RegionStatuses tracks per-region reconcile state.
                items:
                  description: FederationRegionStatus is per-region observed state.
                  properties:
                    error:
                      description: Error contains the last reconcile error (empty
                        when synced).
                      type: string
                    lastSyncTime:
                      description: LastSyncTime is when the controller last reached
                        the region cluster.
                      format: date-time
                      type: string
                    name:
                      description: Name matches Spec.Regions[].Name.
                      type: string
                    phase:
                      description: 'Phase per region: Pending | Synced | Degraded
                        | Failed'
                      enum:
                      - Pending
                      - Synced
                      - Degraded
                      - Failed
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
