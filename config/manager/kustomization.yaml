apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- manager.yaml

  # manager.yaml의 image와 정확히 일치해야 kustomize가 newTag/newName으로 교체 가능.
  # GHCR 마이그레이션 이후 이미지는 harbor.keiailab.dev/keiailab/platform/mongodb-operator.
images:
- name: harbor.keiailab.dev/keiailab/platform/mongodb-operator
  newName: harbor.keiailab.dev/keiailab/platform/mongodb-operator
  newTag: v1.16.6
