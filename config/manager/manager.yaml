---
apiVersion: v1
kind: Namespace
metadata:
  name: mongodb-operator-system
  labels:
    app.kubernetes.io/name: mongodb-operator
    app.kubernetes.io/component: manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-operator-controller-manager
  namespace: mongodb-operator-system
  labels:
    app.kubernetes.io/name: mongodb-operator
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb-operator
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb-operator
        app.kubernetes.io/component: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: mongodb-operator-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: harbor.keiailab.dev/keiailab/platform/mongodb-operator:latest
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --metrics-secure=true
            - --zap-log-level=info
            # Feature gates — keiailab 라이브 Helm operator 와 정합 (OLM cutover 무회귀, ADR-0038).
            # cmd/main.go 기본값은 모두 false 이므로 OLM 으로 배포된 operator 가 sharded/insights/
            # federation/clustergroup/autoscaling controller 를 운영하려면 번들 CSV 에서 명시 활성 필수.
            # (raw `make deploy` 경로도 동일 적용; Helm chart 는 자체 values 게이트로 별도 제어.)
            - --enable-sharded-controller=true
            - --enable-insights-controller=true
            - --enable-federation-controller=true
            - --enable-clustergroup-controller=true
            - --enable-autoscaling=true
            # MongoDBSearch (mongot) — sidecar+PVC fix 검증 완료(kind e2e). mongot 엔진은
            # MongoDB upstream public preview. MongoDBSearch CR opt-in(CR 없으면 mongod 무영향).
            - --enable-search-controller=true
            # MongoDBBackup + PITR oplog uploader — 같은 gate. backup/restore CR opt-in
            # (CR 없으면 무영향). 이 gate 없이는 backup CR 이 reconcile 되지 않아 Phase 가
            # 비어있고 PITR oplog uploader(window/GC)도 미가동한다(kind e2e 로 실증).
            - --enable-backup-controller=true
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      terminationGracePeriodSeconds: 10
