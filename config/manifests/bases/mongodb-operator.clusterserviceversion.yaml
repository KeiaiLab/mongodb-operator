apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "mongodb.keiailab.com/v1alpha1",
          "kind": "MongoDB",
          "metadata": {
            "name": "my-mongodb",
            "namespace": "database"
          },
          "spec": {
            "members": 3,
            "version": {
              "version": "8.3.1"
            },
            "replicaSetName": "rs0",
            "storage": {
              "storageClassName": "ceph-block",
              "size": "50Gi",
              "dataDirPath": "/data/db"
            },
            "resources": {
              "requests": {
                "cpu": "500m",
                "memory": "1Gi"
              },
              "limits": {
                "cpu": "2",
                "memory": "4Gi"
              }
            },
            "auth": {
              "mechanism": "SCRAM-SHA-256",
              "adminCredentialsSecretRef": {
                "name": "mongodb-admin-credentials"
              },
              "users": [
                {
                  "name": "appuser",
                  "db": "admin",
                  "passwordSecretRef": {
                    "name": "mongodb-app-credentials",
                    "key": "password"
                  },
                  "roles": [
                    {
                      "name": "readWrite",
                      "db": "myapp"
                    }
                  ]
                }
              ]
            },
            "tls": {
              "enabled": true,
              "certManager": {
                "issuerRef": {
                  "name": "letsencrypt-cloudflare",
                  "kind": "ClusterIssuer"
                },
                "duration": "2160h",
                "renewBefore": "360h"
              }
            },
            "monitoring": {
              "enabled": true,
              "serviceMonitor": {
                "interval": "30s",
                "labels": {
                  "release": "prometheus"
                }
              },
              "prometheusRules": {
                "enabled": true
              },
              "exporter": {
                "image": "percona/mongodb_exporter:0.40",
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "200m",
                    "memory": "256Mi"
                  }
                }
              }
            },
            "backup": {
              "enabled": true,
              "schedule": "0 2 * * *",
              "retention": {
                "days": 7
              },
              "storage": {
                "type": "s3",
                "s3": {
                  "bucket": "mongodb-backups",
                  "endpoint": "http://ceph-objectstore.rook-ceph.svc:80",
                  "region": "us-east-1",
                  "credentialsRef": {
                    "name": "ceph-objectstore-credentials"
                  },
                  "prefix": "mongodb/my-mongodb/"
                }
              },
              "pitrEnabled": true,
              "oplogRetentionHours": 24
            },
            "pod": {
              "priorityClassName": "system-cluster-critical",
              "securityContext": {
                "fsGroup": 999,
                "runAsUser": 999,
                "runAsNonRoot": true
              }
            }
          }
        },
        {
          "apiVersion": "mongodb.keiailab.com/v1alpha1",
          "kind": "MongoDBSharded",
          "metadata": {
            "name": "my-sharded",
            "namespace": "database"
          },
          "spec": {
            "version": {
              "version": "8.3.1"
            },
            "configServer": {
              "members": 3,
              "storage": {
                "storageClassName": "fast-ssd",
                "size": "10Gi"
              },
              "resources": {
                "requests": {
                  "cpu": "200m",
                  "memory": "512Mi"
                },
                "limits": {
                  "cpu": "1",
                  "memory": "2Gi"
                }
              }
            },
            "shards": {
              "count": 3,
              "membersPerShard": 3,
              "storage": {
                "storageClassName": "ceph-block",
                "size": "100Gi"
              },
              "resources": {
                "requests": {
                  "cpu": "500m",
                  "memory": "2Gi"
                },
                "limits": {
                  "cpu": "2",
                  "memory": "8Gi"
                }
              },
              "autoScaling": {
                "enabled": false,
                "minShards": 2,
                "maxShards": 10,
                "metrics": [
                  {
                    "type": "custom",
                    "target": 80,
                    "customMetric": {
                      "name": "mongodb_sharding_chunks_total"
                    }
                  }
                ]
              }
            },
            "mongos": {
              "replicas": 2,
              "resources": {
                "requests": {
                  "cpu": "200m",
                  "memory": "256Mi"
                },
                "limits": {
                  "cpu": "1",
                  "memory": "1Gi"
                }
              },
              "service": {
                "type": "LoadBalancer",
                "port": 27017,
                "annotations": {
                  "metallb.universe.tf/address-pool": "default-pool"
                }
              },
              "autoScaling": {
                "enabled": true,
                "minReplicas": 2,
                "maxReplicas": 10,
                "metrics": [
                  {
                    "type": "cpu",
                    "target": 70
                  },
                  {
                    "type": "memory",
                    "target": 80
                  }
                ]
              }
            },
            "auth": {
              "mechanism": "SCRAM-SHA-256",
              "adminCredentialsSecretRef": {
                "name": "mongodb-sharded-admin"
              },
              "users": [
                {
                  "name": "appuser",
                  "db": "admin",
                  "passwordSecretRef": {
                    "name": "mongodb-sharded-app",
                    "key": "password"
                  },
                  "roles": [
                    {
                      "name": "readWrite",
                      "db": "myapp"
                    }
                  ]
                }
              ]
            },
            "tls": {
              "enabled": true,
              "certManager": {
                "issuerRef": {
                  "name": "letsencrypt-cloudflare",
                  "kind": "ClusterIssuer"
                }
              }
            },
            "monitoring": {
              "enabled": true,
              "serviceMonitor": {
                "interval": "30s",
                "labels": {
                  "release": "prometheus"
                }
              },
              "prometheusRules": {
                "enabled": true
              }
            },
            "backup": {
              "enabled": true,
              "schedule": "0 3 * * *",
              "retention": {
                "days": 14
              },
              "storage": {
                "type": "s3",
                "s3": {
                  "bucket": "mongodb-backups",
                  "endpoint": "http://ceph-objectstore.rook-ceph.svc:80",
                  "credentialsRef": {
                    "name": "ceph-objectstore-credentials"
                  },
                  "prefix": "mongodb/sharded/"
                }
              }
            }
          }
        },
        {
          "apiVersion": "mongodb.keiailab.com/v1alpha1",
          "kind": "MongoDBBackup",
          "metadata": {
            "name": "my-mongodb-backup-manual",
            "namespace": "database"
          },
          "spec": {
            "clusterRef": {
              "name": "my-mongodb",
              "kind": "MongoDB"
            },
            "type": "full",
            "compression": true,
            "compressionType": "zstd",
            "storage": {
              "type": "s3",
              "s3": {
                "bucket": "mongodb-backups",
                "endpoint": "http://ceph-objectstore.rook-ceph.svc:80",
                "region": "us-east-1",
                "credentialsRef": {
                  "name": "ceph-objectstore-credentials"
                },
                "prefix": "mongodb/manual-backups/",
                "insecureSkipTLS": true
              }
            }
          }
        }
      ]
    capabilities: Seamless Upgrades
    categories: Database, Storage
    containerImage: ghcr.io/keiailab/mongodb-operator:v1.4.19
    createdAt: "2026-05-10T00:00:00Z"
    description: |
      Kubernetes operator for MongoDB — manages MongoDB (ReplicaSet) and
      MongoDBSharded (config server + shards + mongos) CRDs with K8s Lease
      distributed lock for race-free admin bootstrap, mongos HPA, and shard
      drain backoff.
    repository: https://github.com/keiailab/mongodb-operator
    support: https://github.com/keiailab/mongodb-operator/issues
  name: mongodb-operator.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: MongoDB 는 ReplicaSet 토폴로지의 단일 클러스터를 선언적으로 관리하는 CRD 다 (primary + secondaries + optional arbiter).
      displayName: MongoDB
      kind: MongoDB
      name: mongodbs.mongodb.keiailab.com
      version: v1alpha1
    - description: MongoDBSharded 는 sharded cluster 를 선언적으로 관리하는 CRD 다 (config server replica set + N shards × replica set + mongos router).
      displayName: MongoDB Sharded
      kind: MongoDBSharded
      name: mongodbshardeds.mongodb.keiailab.com
      version: v1alpha1
    - description: MongoDBBackup 은 mongodump 기반 backup Job 추상이다 (PVC 또는 외부 storage target).
      displayName: MongoDB Backup
      kind: MongoDBBackup
      name: mongodbbackups.mongodb.keiailab.com
      version: v1alpha1
  description: |
    # MongoDB Operator

    Kubernetes operator for [MongoDB](https://www.mongodb.com/) — manages
    `MongoDB` (ReplicaSet) and `MongoDBSharded` (config server + shards +
    mongos) Custom Resources with declarative reconciliation.

    ## Features

    - **MongoDB CRD** — ReplicaSet topology with primary + secondaries +
      optional arbiter / hidden / delayed members.
    - **MongoDBSharded CRD** — config server RS + N shards × RS + mongos
      router. Declarative scale-in / scale-out with backoff drain.
    - **K8s Lease distributed lock** — race-free admin user bootstrap
      (ADR-0002 bootstrap_lease pattern).
    - **HPA support** — mongos HorizontalPodAutoscaler with deliberate guard
      to prevent unintended RS member changes.
    - **MongoDBBackup CRD** — mongodump-based backup Job, PVC or external
      storage target (S3 ADR-0016).
    - **Supply chain** — Cosign signed container images + SBOM (SPDX-2.3) on
      every release.
    - **Security baseline** — Pod Security Standards, RBAC least-privilege,
      NetworkPolicy isolation, non-root runAsUser.

    ## Documentation

    - GitHub: https://github.com/keiailab/mongodb-operator
    - Helm Chart: https://artifacthub.io/packages/helm/mongodb-operator/mongodb-operator
    - Discussions: https://github.com/keiailab/mongodb-operator/discussions

    ## Prerequisites

    - Kubernetes 1.26+
    - Storage class for PVCs (recommended: ceph-rbd or comparable RWO)
    - (Optional) cert-manager for automatic TLS certificate management
    - (Optional) Prometheus Operator for `ServiceMonitor` scraping
