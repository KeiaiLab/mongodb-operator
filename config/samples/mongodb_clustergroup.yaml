---
# MongoDBClusterGroup 샘플 — 여러 MongoDB/MongoDBSharded 인스턴스를 단일 그룹으로 묶어
# 중앙 모니터링(Grafana/Prometheus) + 공통 정책(TLS/암호화/백업 보존)을 적용한다.
# 멀티클러스터 federation 의 경량(단일 클러스터 내 그룹화) 버전.
apiVersion: mongodb.keiailab.com/v1alpha1
kind: MongoDBClusterGroup
metadata:
  name: keiailab-data-group
  namespace: data
spec:
  members:
    - name: keiailab-mongo
      kind: MongoDBSharded
      namespacedName:
        name: keiailab-mongo
        namespace: data
  centralMonitoring:
    grafanaURL: https://grafana.keiailab.com
  policyTemplate:
    minBackupRetentionDays: 7
    requiredTLSEnabled: false
    requiredEncryptionAtRest: false
