# File-Based Catalog (FBC) — mongodb-operator (ADR-0028 / ADR-0038).
#
# OLM v1 minimal FBC: olm.package + olm.channel + olm.bundle(image + properties).
# embedded olm.bundle.object/csv.metadata 미사용 — operator-controller 가 install 시
# bundle image 를 pull 하여 manifests 적용. 7 CRD (특히 mongodbshardeds) 의 schema embed 는
# catalog.yaml 을 비대(opm render --migrate 시 >1GB)하게 만들어 비현실적 (ADR-0038 RCA).
# GVK 는 dependency/conflict resolution 용으로만 선언 (14 = 7 kind × {v1alpha1,v1beta1}).
#
# image: 는 `make catalog-build` 가 push 된 bundle 의 digest 로 자동 pin (mutable tag 보호).
schema: olm.package
name: mongodb-operator
defaultChannel: stable
