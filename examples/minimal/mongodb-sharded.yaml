---
# Minimal MongoDB Sharded Cluster Example
# Production-ready but simplified configuration for moderate workloads
# Features: 2 shards (3 members each), config server (3 members), mongos (2 replicas)
#
# ⚠️ WARNING: v1.3.2-beta.x 에서는 Sharded 모드가 *기본 비활성*입니다.
# 본 예제를 적용하려면 helm values에 `features.sharded.enabled=true`를 명시 설정해야 합니다.
# 베타에서는 ConfigServer init/HPA ordering race + mongos status 정합성 깨짐 케이스가 미해결입니다.
# 정식 1.4.0 GA 전까지 *비프로덕션 데이터* 한정 사용을 권장합니다. CHANGELOG.md 참조.

apiVersion: mongodb.keiailab.com/v1alpha1
kind: MongoDBSharded
metadata:
  name: my-sharded
  namespace: database
spec:
  # MongoDB version
  version:
    version: "8.2"

  # Config server configuration (required for sharded clusters)
  configServer:
    # 3 members for high availability
    members: 3
    storage:
      # Update to match your cluster's storage class
      storageClassName: standard
      size: 5Gi
      dataDirPath: /data/configdb
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  # Shard configuration
  shards:
    # Number of shards (adjust based on your data size and query patterns)
    count: 2
    # Members per shard (3 for high availability)
    membersPerShard: 3
    storage:
      # Update to match your cluster's storage class
      storageClassName: standard
      size: 50Gi
      dataDirPath: /data/db
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"

  # Mongos router configuration
  mongos:
    # 2 replicas for high availability
    replicas: 2
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    service:
      # ClusterIP for internal access (use LoadBalancer for external)
      type: ClusterIP
      port: 27017

  # Authentication configuration
  auth:
    mechanism: SCRAM-SHA-256
    # Reference to admin credentials secret (create before deployment)
    adminCredentialsSecretRef:
      name: mongodb-sharded-admin
    # Optional: Create application users
    users:
      - name: appuser
        db: admin
        passwordSecretRef:
          name: mongodb-sharded-app
          key: password
        roles:
          - name: readWrite
            db: myapp

---
# Admin credentials Secret
# Create this secret before deploying the MongoDBSharded resource
# IMPORTANT: Use strong passwords in production!
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-sharded-admin
  namespace: database
type: Opaque
stringData:
  username: admin
  # Replace with strong password in production
  password: "change-me-in-production"

---
# Application user credentials Secret
# Create this secret before deploying the MongoDBSharded resource
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-sharded-app
  namespace: database
type: Opaque
stringData:
  # Replace with strong password in production
  password: "app-password-change-me"

---
# Namespace (optional - create if namespace doesn't exist)
apiVersion: v1
kind: Namespace
metadata:
  name: database
