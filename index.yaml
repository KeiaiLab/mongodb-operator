  - annotations:
      artifacthub.io/category: database
      artifacthub.io/changes: |
        - kind: added
          description: "MongoDBSearchIndex controller — declarative $search/$vectorSearch index lifecycle (create/update/delete via mongo-driver SearchIndexView). The CRD was a no-op shell before."
        - kind: added
          description: "Sharded cluster search support — per-shard mongot sidecar (port 27018) with $search/$vectorSearch served via mongos fan-out and index commands routed through the mongos endpoint."
        - kind: added
          description: "MongoDBSearch status conditions (Available/Progressing/Degraded) and ReadyReplicas populated from actual mongot sidecar container readiness."
        - kind: added
          description: "searchCoordinator sync user is auto-created (dual SCRAM-SHA-1/256) with adopt-safe secret handling; manual user provisioning is no longer required."
        - kind: fixed
          description: "make deploy no longer strips feature-gate args (--enable-search-controller etc.): the manager_auth_proxy_patch strategic-merge replaced the full args list, so it was removed and config/manager/manager.yaml is now the single source of truth."
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/crds: |
