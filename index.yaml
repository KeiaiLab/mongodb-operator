    version: 1.4.22
  - annotations:
      artifacthub.io/category: database
      artifacthub.io/changes: "- kind: fixed\n  description: \"Sharded P0 — PodTemplate\
        \ merge 를 current template 기반 overlay 로 전환해 EnableServiceLinks 등 미명시 server-default\
        \ 전체를 보존. mongos Deployment generation 증가 루프를 차단.\"\n- kind: fixed\n  description:\
        \ \"ReconcileError=True condition 이 성공 reconcile 후에도 남는 status clear 결함 fix.\
        \ 성공 상태 업데이트 시 기존 ReconcileError 를 False/ReconcileSucceeded 로 전환.\"\n- kind:\
        \ fixed\n  description: \"Sharded P0 — mongos Deployment PodTemplate server-default\
        \ ping-pong (imagePullPolicy/probe defaults/DNS/restart/scheduler 등) 으로 generation\
        \ 180k+ 증가 + update conflict 반복. applyDeployment가 기존 server-defaulted PodTemplate\
        \ 값을 보존하도록 확장.\"\n- kind: fixed\n  description: \"Sharded P0 — Helm chart\
        \ bundled CRD drift (5,272 줄 격차) → status 신규 필드 (adminUserCreated/configServerInitialized/shardsInitialized/shardsAdded)\
        \ 가 K8s API server 에 의해 silently drop 되어 reconcile flag 영구 empty + addShards\
        \ index-out-of-range panic. CRD 자동 sync (manifests → sync-crds) + reconcileAddShards\
        \ length 가드 추가.\"\n- kind: fixed\n  description: \"Sharded P0 — applyDeployment\
        \ server-default ping-pong (mongos Deployment generation 116k+ 무한 fight 해소;\
        \ RevisionHistoryLimit/ProgressDeadlineSeconds nil-guard) [v1.4.2]\"\n- kind:\
        \ fixed\n  description: \"Sharded P1 #3 — HPA informer cache timeout fix (SetupWithManager\
        \ Owns에 HorizontalPodAutoscaler 추가, RS controller와 동일하게 정렬)\"\n- kind: fixed\n\
        \  description: \"Sharded P1 #1 — HPA reconcile은 ConfigServer/Shards rs.initiate\
        \ 완료 후 실행 (HPA가 crashloop pod metric을 sample하던 결함)\"\n- kind: fixed\n  description:\
        \ \"Sharded P1 #2 — Status.Mongos/ConfigServer Total은 HPA active 시 obj.Spec.Replicas,\
        \ inactive 시 CR.Spec을 source-of-truth로 분기 (24h soak divergence 해소)\"\n- kind:\
        \ changed\n  description: \"features.sharded.enabled 기본값 false → true (베타\
        \ carve-out 종료)\"\n- kind: fixed\n  description: Helm repository URL과 GHCR\
        \ image owner를 keiailab로 정정 (이전 publish 경로 복구)\n- kind: added\n  description:\
        \ HorizontalPodAutoscaler 자동화 — RS/cfg/mongos 이중 가드 + drift 방지 + status 노출\n\
        - kind: added\n  description: PodDisruptionBudget automation for MongoDB ReplicaSet\
        \ and MongoDBSharded (opt-in)\n- kind: added\n  description: NetworkPolicy\
        \ automation with deny-by-default + additional ingress peers (opt-in)\n- kind:\
        \ added\n  description: MongoDBSharded Scale-in via removeShard with ShardDraining\
        \ condition + resource cleanup\n- kind: added\n  description: envtest-based\
        \ controller integration regression suite\n- kind: changed\n  description:\
        \ Bootstrap admin user is race-free via Kubernetes Lease distributed lock\
        \ + post-bootstrap usersInfo verify\n- kind: changed\n  description: Auth\
        \ error detection migrated to typed mongo.ServerError (HasErrorCode 13/18/11000/51003)\
        \ with message fallback\n- kind: changed\n  description: Self-managed createOrUpdate\
        \ replaced with controllerutil.CreateOrUpdate(mutateFn) — eliminates Spec\
        \ drift on partial mutations\n- kind: fixed\n  description: ReconcileError\
        \ condition no longer accumulates on repeated failures\n- kind: fixed\n  description:\
        \ updateStatus no longer silently skips primary probe errors — surfaces PrimaryUnreachable\
        \ condition\n- kind: fixed\n  description: isClusterReady rejects partial-status\
        \ and zero-spec configurations\n"
      artifacthub.io/containsSecurityUpdates: 'true'
      artifacthub.io/crds: "- kind: MongoDB\n  version: v1alpha1\n  name: mongodbs.mongodb.keiailab.com\n\
        \  displayName: MongoDB ReplicaSet\n  description: Deploys and manages a MongoDB\
        \ ReplicaSet cluster\n- kind: MongoDBSharded\n  version: v1alpha1\n  name:\
        \ mongodbshardeds.mongodb.keiailab.com\n  displayName: MongoDB Sharded Cluster\n\
        \  description: Deploys and manages a MongoDB Sharded cluster with config\
        \ servers, shards, and mongos routers\n- kind: MongoDBBackup\n  version: v1alpha1\n\
        \  name: mongodbbackups.mongodb.keiailab.com\n  displayName: MongoDB Backup\n\
        \  description: Creates and manages MongoDB backups to S3 or PVC storage\n"
      artifacthub.io/crdsExamples: "- apiVersion: mongodb.keiailab.com/v1alpha1\n\
        \  kind: MongoDB\n  metadata:\n    name: my-mongodb\n    namespace: database\n\
        \  spec:\n    members: 3\n    version:\n      version: \"8.3.1\"\n    storage:\n\
        \      storageClassName: standard\n      size: 10Gi\n    auth:\n      mechanism:\
        \ SCRAM-SHA-256\n      adminCredentialsSecretRef:\n        name: mongodb-admin\n\
        \    monitoring:\n      enabled: true\n- apiVersion: mongodb.keiailab.com/v1alpha1\n\
        \  kind: MongoDBSharded\n  metadata:\n    name: my-sharded\n    namespace:\
        \ database\n  spec:\n    version:\n      version: \"8.3.1\"\n    configServer:\n\
        \      members: 3\n      storage:\n        size: 5Gi\n    shards:\n      count:\
        \ 2\n      membersPerShard: 3\n      storage:\n        size: 20Gi\n    mongos:\n\
        \      replicas: 2\n- apiVersion: mongodb.keiailab.com/v1alpha1\n  kind: MongoDBBackup\n\
        \  metadata:\n    name: my-backup\n    namespace: database\n  spec:\n    clusterRef:\n\
        \      name: my-mongodb\n      kind: MongoDB\n    type: full\n    compression:\
        \ true\n    storage:\n      type: s3\n      s3:\n        bucket: mongodb-backups\n\
        \        endpoint: https://s3.amazonaws.com\n        credentialsRef:\n   \
        \       name: s3-credentials\n"
      artifacthub.io/images: "- name: mongodb-operator\n  image: ghcr.io/keiailab/mongodb-operator:1.4.20\n\
        - name: mongodb\n  image: mongo:8.3.1\n- name: mongodb-exporter\n  image:\
        \ percona/mongodb_exporter:0.40\n"
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: "- name: Documentation\n  url: https://github.com/keiailab/mongodb-operator/blob/main/README.md\n\
        - name: Source Code\n  url: https://github.com/keiailab/mongodb-operator\n\
        - name: MongoDB Documentation\n  url: https://www.mongodb.com/docs/\n"
      artifacthub.io/operatorCapabilities: Seamless Upgrades
      artifacthub.io/prerelease: 'false'
      artifacthub.io/recommendations: '- url: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack

        - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager

        '
