  - annotations:
      artifacthub.io/category: database
      artifacthub.io/changes: "- kind: fixed\n  description: \"Sharded P0 — Helm chart\
        \ bundled CRD drift (5,272 줄 격차) → status 신규 필드 (adminUserCreated/configServerInitialized/shardsInitialized/shardsAdded)\
        \ 가 K8s API server 에 의해 silently drop 되어 reconcile flag 영구 empty + addShards\
        \ index-out-of-range panic. CRD 자동 sync (manifests → sync-crds) + reconcileAddShards\
        \ length 가드 추가.\"\n- kind: fixed\n  description: \"Sharded P0 — applyDeployment\
        \ server-default ping-pong (mongos Deployment generation 116k+ 무한 fight 해소;\
        \ RevisionHistoryLimit/ProgressDeadlineSeconds nil-guard) [v1.4.2]\"\n- kind:\
        \ fixed\n  description: \"Sharded P1 #3 — HPA informer cache timeout fix (SetupWithManager\
        \ Owns에 HorizontalPodAutoscaler 추가, RS controller와 동일하게 정렬)\"\n- kind: fixed\n\
        \  description: \"Sharded P1 #1 — HPA reconcile은 ConfigServer/Shards rs.initiate\
        \ 완료 후 실행 (HPA가 crashloop pod metric을 sample하던 결함)\"\n- kind: fixed\n  description:\
        \ \"Sharded P1 #2 — Status.Mongos/ConfigServer Total은 HPA active 시 obj.Spec.Replicas,\
        \ inactive 시 CR.Spec을 source-of-truth로 분기 (24h soak divergence 해소)\"\n- kind:\
        \ changed\n  description: \"features.sharded.enabled 기본값 false → true (베타\
        \ carve-out 종료)\"\n- kind: fixed\n  description: Helm repository URL과 GHCR\
        \ image owner를 keiailab로 정정 (이전 publish 경로 복구)\n- kind: added\n  description:\
        \ HorizontalPodAutoscaler 자동화 — RS/cfg/mongos 이중 가드 + drift 방지 + status 노출\n\
        - kind: added\n  description: PodDisruptionBudget automation for MongoDB ReplicaSet\
        \ and MongoDBSharded (opt-in)\n- kind: added\n  description: NetworkPolicy\
        \ automation with deny-by-default + additional ingress peers (opt-in)\n- kind:\
        \ added\n  description: MongoDBSharded Scale-in via removeShard with ShardDraining\
        \ condition + resource cleanup\n- kind: added\n  description: envtest-based\
        \ controller integration regression suite\n- kind: changed\n  description:\
        \ Bootstrap admin user is race-free via Kubernetes Lease distributed lock\
        \ + post-bootstrap usersInfo verify\n- kind: changed\n  description: Auth\
        \ error detection migrated to typed mongo.ServerError (HasErrorCode 13/18/11000/51003)\
        \ with message fallback\n- kind: changed\n  description: Self-managed createOrUpdate\
        \ replaced with controllerutil.CreateOrUpdate(mutateFn) — eliminates Spec\
        \ drift on partial mutations\n- kind: fixed\n  description: ReconcileError\
        \ condition no longer accumulates on repeated failures\n- kind: fixed\n  description:\
        \ updateStatus no longer silently skips primary probe errors — surfaces PrimaryUnreachable\
        \ condition\n- kind: fixed\n  description: isClusterReady rejects partial-status\
        \ and zero-spec configurations\n"
