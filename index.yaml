  - annotations:
      artifacthub.io/category: database
      artifacthub.io/changes: "- kind: fixed\n  description: Helm repository URL과\
        \ GHCR image owner를 keiailab로 정정 (이전 publish 경로 복구)\n- kind: added\n  description:\
        \ HorizontalPodAutoscaler 자동화 — RS/cfg/mongos 이중 가드 + drift 방지 + status 노출\n\
        - kind: added\n  description: PodDisruptionBudget automation for MongoDB ReplicaSet\
        \ and MongoDBSharded (opt-in)\n- kind: added\n  description: NetworkPolicy\
        \ automation with deny-by-default + additional ingress peers (opt-in)\n- kind:\
        \ added\n  description: MongoDBSharded Scale-in via removeShard with ShardDraining\
        \ condition + resource cleanup\n- kind: added\n  description: envtest-based\
        \ controller integration regression suite\n- kind: changed\n  description:\
        \ Bootstrap admin user is race-free via Kubernetes Lease distributed lock\
        \ + post-bootstrap usersInfo verify\n- kind: changed\n  description: Auth\
        \ error detection migrated to typed mongo.ServerError (HasErrorCode 13/18/11000/51003)\
        \ with message fallback\n- kind: changed\n  description: Self-managed createOrUpdate\
        \ replaced with controllerutil.CreateOrUpdate(mutateFn) — eliminates Spec\
        \ drift on partial mutations\n- kind: fixed\n  description: ReconcileError\
        \ condition no longer accumulates on repeated failures\n- kind: fixed\n  description:\
        \ updateStatus no longer silently skips primary probe errors — surfaces PrimaryUnreachable\
        \ condition\n- kind: fixed\n  description: isClusterReady rejects partial-status\
        \ and zero-spec configurations\n"
      artifacthub.io/containsSecurityUpdates: 'true'
      artifacthub.io/crds: "- kind: MongoDB\n  version: v1alpha1\n  name: mongodbs.mongodb.keiailab.com\n\
        \  displayName: MongoDB ReplicaSet\n  description: Deploys and manages a MongoDB\
        \ ReplicaSet cluster\n- kind: MongoDBSharded\n  version: v1alpha1\n  name:\
        \ mongodbshardeds.mongodb.keiailab.com\n  displayName: MongoDB Sharded Cluster\n\
        \  description: Deploys and manages a MongoDB Sharded cluster with config\
        \ servers, shards, and mongos routers\n- kind: MongoDBBackup\n  version: v1alpha1\n\
        \  name: mongodbbackups.mongodb.keiailab.com\n  displayName: MongoDB Backup\n\
        \  description: Creates and manages MongoDB backups to S3 or PVC storage\n"
      artifacthub.io/crdsExamples: "- apiVersion: mongodb.keiailab.com/v1alpha1\n\
        \  kind: MongoDB\n  metadata:\n    name: my-mongodb\n    namespace: database\n\
        \  spec:\n    members: 3\n    version:\n      version: \"8.2\"\n    storage:\n\
        \      storageClassName: standard\n      size: 10Gi\n    auth:\n      mechanism:\
        \ SCRAM-SHA-256\n      adminCredentialsSecretRef:\n        name: mongodb-admin\n\
        \    monitoring:\n      enabled: true\n- apiVersion: mongodb.keiailab.com/v1alpha1\n\
        \  kind: MongoDBSharded\n  metadata:\n    name: my-sharded\n    namespace:\
        \ database\n  spec:\n    version:\n      version: \"8.2\"\n    configServer:\n\
        \      members: 3\n      storage:\n        size: 5Gi\n    shards:\n      count:\
        \ 2\n      membersPerShard: 3\n      storage:\n        size: 20Gi\n    mongos:\n\
        \      replicas: 2\n- apiVersion: mongodb.keiailab.com/v1alpha1\n  kind: MongoDBBackup\n\
